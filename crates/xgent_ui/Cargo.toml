[package]
name = "xgent_ui"
version = "0.1.0"
edition = "2024"

[features]
# 旧的终端排版路径（flex 行 + shaper 连续排版）——默认**不开启**。
#
# v8 M4-T2：按格定位路径落地后，旧路径保留在本 feature 下，用于与新路径做
# A/B 截图对照；对照通过后连同该 feature 一起删除。
legacy-terminal-layout = []

[dependencies]
bevy = { workspace = true, features = ["ui", "bevy_ui_widgets", "default_font"] }
xgent_core = { path = "../xgent_core" }
xgent_settings = { path = "../xgent_settings" }
xgent_settings_core = { path = "../xgent_settings_core" }
xgent_terminal = { path = "../xgent_terminal" }
xgent_agent = { path = "../xgent_agent" }
xgent_tools = { path = "../xgent_tools" }
xgent_spatial = { path = "../xgent_spatial" }
xui = { path = "../xui" }
parley = { workspace = true }
xui_i18n = { path = "../xui_i18n" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
pulldown-cmark = { workspace = true }

crossbeam-channel = { workspace = true }
[dev-dependencies]
bevy = { workspace = true, features = ["ui", "bevy_ui_widgets", "default_font", "bevy_dev_tools"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

    text: A1 槽位与描述符模型：`Slot` 覆盖
      `Rail/Center/SideDock/BottomDock/SettingsSection/StatusSegment/Palette/Overlay`；`PanelDescriptor.title_key`
      必填（i18n key）；`PanelRegistry` 可注册并按 id / slot 查询（按 `order`
      排序）；`PanelRegister` / `PanelActivate` / `PanelDeactivate` 是 ECS `Message`。
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: A2 扩展性（北极星前置）：新增一个 `SideDock` 面板只需「一个描述符 + 一个视图模块 + 一条
      `PanelRegister`」；`crates/xgent_ui/src/layout.rs` 与
      `crates/xgent_ui/src/editor/mod.rs` 中不含 `SideViewContent`，也不含按面板 id 分派的
      `match`。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: A3 rail 选中态派生：`ActiveActivity` 资源被删除；rail 选中态由「注册表 ∩ 槽位可见性」派生；连点 Files
      两次关闭抽屉后，rail 上不残留 Files 选中态。
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: A4 历史面板进槽位：`session_history`
      由自建浮层改为注册面板（`Slot::Overlay`），与文件抽屉同属单例槽位，二者同一时刻至多一个可见（不再争层级）。
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: A5 派生可见性单一系统：`derive_panel_visibility` 是**唯一**写「面板 / 区域」`Node.display`
      的系统；原 7 处动态面板可见性写手（`layout.rs` 分屏与手柄、`file_panel.rs`
      遮罩与面板、`activity_bar.rs` 展开钮、`editor/mod.rs` 编辑器视图、`terminal/mod.rs`
      终端视图）全部并入该系统；3 处 spawn 期默认值改为构造期字面量；`crates/xgent_ui/src/` 内 `.display =`
      的命中**仅限**「派生系统 + 构造期字面量 + 5 处内容态白名单」（`chat_panel.rs`
      回到底部按钮、`activity_bar.rs` 陪伴激活环、`welcome.rs` 欢迎空态、`welcome.rs`
      最近会话标题、`editor/mod.rs` 编辑器文档页签），白名单以源码级测试固化且逐条注明属内容态而非面板态。
    result: pending
    reason: null

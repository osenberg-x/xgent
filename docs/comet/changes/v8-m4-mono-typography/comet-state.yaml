acceptance:
  - id: A1
    source: brief.md
    text: A1 编辑器代码正文使用 `mono` 槽位：`sync_editor_theme` 运行后 `EditorTheme.font` 等于
      `UiFonts.mono`；虚拟渲染创建的代码文本 `TextFont.font` 等于该值。
    result: failed
    reason:
      text: "接线只做到容器层，真正承载代码字形的 TextSpan 仍是比例字体。sync_editor_theme 确实把 UiFonts.mono 注入
        EditorTheme.font（crates/xgent_ui/src/editor/mod.rs:282），virtual_render
        也把它写进容器 Text 实体的
        TextFont（crates/xui/src/text_editor/virtual_render.rs:179、227）；但可见代码文本由
        TextSpan 子节点承载，其 TextFont 为 { font_size, ..default()
        }（virtual_render.rs:333-345、355-364），font 字段即
        FontSource::default()=默认字体句柄→xgent_app/startup.rs:81 覆盖为 Inter
        Variable（比例字体）。Bevy 0.20 逐 span 解析字体：TextReader 对每个 span 取其自身
        TextFont（bevy_text/src/text_access.rs:174-194），TextPipeline::update_buf\
        fer 按 section 自身的 text_font.font.resolve_font_family 下发
        StyleProperty::FontFamily（bevy_text/src/pipeline.rs:230-232），而根实体文本为空（T\
        ext::new(String::new())，virtual_render.rs:171）在 pipeline.rs:124-126 被
        continue 跳过 → 根上的 mono
        字体不对任何字形生效。后果：原始缺陷（行号数字宽度不等→行号列与代码列错位）未被修复，且行号列（已改
        mono）与代码列（仍比例）反而不同源。新增 tests/mono_typography.rs 的 A1/A2 用例只做
        include_str!+contains 的源码字符串断言，发现不了该缺陷。修复方向：rebuild_visible_spans 生成的每个
        TextSpan 需带 font: theme.font.clone()（由 EditorTheme.font
        派生），并补运行时断言而非源码断言。"
      truncated: false
  - id: A2
    source: brief.md
    text: A2 编辑器行号列使用 `mono`：打开文件后行号实体的 `TextFont.font` 等于 `UiFonts.mono`（与代码列同源 →
      数字等宽 → 行号与代码列对齐）。
    result: passed
    reason:
      text: "行号列有效走 mono。crates/xgent_ui/src/editor/tabs.rs:200-210 的行号实体是根 Text（非
        span），自带 TextFont{ font: editor_theme.font.clone()
        }，根文本字形按自身字体解析（bevy_text/src/pipeline.rs:230）→
        生效。系统顺序正确：sync_editor_theme 在 xui::TextEditorUpdateSet
        之前（editor/mod.rs:107），handle_open_file_requests
        在其之后（editor/mod.rs:161），spawn 时 editor_theme.font 已是 mono
        槽位。残留低风险：行号实体字体只在 spawn 时写一次，槽位运行时变更不会跟随（mono 槽位启动期固定，实际不触发）。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3 diff 行与工具卡参数摘要使用 `mono`：两处文本的 `TextFont.font` 等于 `UiFonts.mono`。
    result: passed
    reason:
      text: "两处都是根 Text + mono 字体，实际生效。diff
        行：crates/xgent_ui/src/editor/diff_view.rs:185 改用 mono_text(&fonts, ...)
        → fonts.rs:517-533 的 TextFont{ font: fonts.mono.clone()
        }。工具卡参数摘要：crates/xgent_ui/src/tool_panel.rs:183 改用
        ellipsis_mono_text(&fonts, summary, ...) → fonts.rs:469-492；省略测量读同一实体的
        TextFont（xui/src/ellipsis.rs:282），字体来源一致。遗留（不在 brief 列出的 4
        点内，记入风险）：工具卡结果区 stdout（tool_panel.rs:242）仍是 ui_text + CAPTION
        字号，属代码类文本但未走 mono。"
      truncated: false

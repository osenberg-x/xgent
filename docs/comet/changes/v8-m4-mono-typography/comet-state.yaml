        两处 span spawn 均带 `TextFont { font: font.clone(), .. }`，font 参数在
        virtual_render.rs:266 由 `Res<EditorTheme>` 传入
        `&theme.font`；xui/src/text_editor/render.rs:90-98 高亮层 span 同样带 `font:
        theme.font.clone()`。注入端 xgent_ui/src/editor/mod.rs:282
        `editor_theme.font = fonts.mono.clone();`，且 editor/mod.rs:107
        `sync_editor_theme.before(xui::TextEditorUpdateSet)` 保证首次 span 重建前 mono
        已就位。mono_typography.rs 的 A1 断言已补「span 必须自带字体来源」。"

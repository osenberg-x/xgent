        标题改用 display_spacing(&tr(&loc, "welcome-title"))，取代原硬写
        LetterSpacing::Px(-0.29)，且该实体是根 Text 非空 → 生效。D-4 成立：全仓仅剩两处 LetterSpacing
        均为 +0.5（kit.rs:632、welcome.rs:156），对 CJK 无害未动。
      truncated: false

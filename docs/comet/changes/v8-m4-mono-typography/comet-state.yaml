        副本；会话历史列表同理（session_history.rs:585 固定 BODY）。后果：中文助手消息最终以 1.6 渲染（1.7
        约束落不到主界面），且流式时 1.7 → 完成时 1.6 出现行高跳变。spec
        明确要求「对话消息正文（用户消息与助手正文）使用该函数」，未达成；修复点为 chat_panel.rs:663 与
        session_history.rs:585 改用 for_text。
      truncated: false

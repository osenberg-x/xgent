acceptance:
  - id: A1
    source: brief.md
    text: "A1: Every entry in the R1 and R2 tiers of `doc/notes/agent-gap-review.md`
      is either implemented in this change or recorded as deferred with a named
      reason, and the classification covers all 14 entries."
    result: passed
    reason:
      text: 第三轮独立验证通过。报告本身未被修改（git status 显示 doc/notes/agent-gap-review.md
        仍是未跟踪的原始审查产物，本次未编辑其内容）。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: The agent loop stops after a bounded number of tool-call iterations
      or when a cumulative token ceiling is reached, and it reports which bound
      it hit instead of silently stopping."
    result: passed
    reason:
      text: 第三轮独立验证通过。两处测试分别把闸压到 3 轮 / 150 token 并断言命中的界与终止语义（Idle 而非 Error）。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: The retry configuration defaults to a finite retry count, 429 and 5xx
      responses are retried, and a provider-supplied `Retry-After` overrides the
      computed backoff delay."
    result: passed
    reason:
      text: 第三轮独立验证通过。第一轮判 failed（Retry-After 在 IPC 边界被丢弃）。第二轮复核确认五段链路已打通；其提出的『流内构造点仍为
        None』经复核不构成缺陷——Retry-After 是响应头，2xx 响应头发出后即固定，流内不存在可读的头，429
        按定义落在建流路径，而建流路径正是已打通的那条；流内传输链本身是通的（ChatEvent::Error.retry_after_secs 有
        serde 默认值与全链路反序列化，真有值可直达重试层）。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Aborting a response issues a cancel through the daemon to the
      provider, the spawned stream task terminates, and no further tokens are
      produced for the abandoned stream."
    result: passed
    reason:
      text: 第三轮独立验证通过。前两轮均判 failed 的核心项：第一轮 drop 接收端不终止上游 body；第二轮确认修复但指出我的测试无判别力。本轮补齐
        anthropic 首事件前守卫并重写为有判别力的测试（已用移除守卫的反证实验验证）。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: `read_file` accepts `offset` and `limit`, truncates output that
      exceeds its cap with an explicit marker, and never splits a UTF-8
      character."
    result: passed
    reason:
      text: 第三轮独立验证通过。截断与切片都不切碎 UTF-8 字符；offset 越界返回空、limit 越界钳制，均不报错（模型常按估算行号请求）。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: A new `edit_file` tool applies a line-range replacement to an
      existing file, writes atomically, leaves a backup of the original, and
      reports a clear error when the specified lines do not match the expected
      content."
    result: passed
    reason:
      text: 第三轮独立验证通过。写入路径与 write_file 共用 atomic::atomic_write（同目录 rename，原子）；写前备份为
        <name>.xgent-bak。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: A dangerous command in `run_command` yields a stricter approval
      outcome than an ordinary command, and plugin `run_command` rejects an
      argument outside the manifest's allowed set."
    result: passed
    reason:
      text: 第三轮独立验证通过。危险命令检测此前命中与未命中都返回 Exec，severity 相等使升级分支不可达；Dangerous tier
        使其真正生效（有针对性单测证明普通命令仍放行）。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Plugin tools supply a real `preview_diff` and a real `summarize`
      through the WIT bridge, and the tool update callback delivers streaming
      tool output to the UI as `Arc` instead of a borrowed boxed closure."
    result: passed
    reason:
      text: 第三轮独立验证通过。summarize 由同步改 async 是必要的：WIT 方法为 async，同步签名无法 await WASM 调用。这是
        trait 破坏性变更，已全量改完 9 处实现并通过编译与测试。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: An API key stored in the OS keychain is used in preference to the
      TOML value, a missing or unreadable keychain falls back to TOML, and the
      TOML value is preserved rather than deleted."
    result: passed
    reason:
      text: 第三轮独立验证通过。TOML 值永不被删除是硬约束（凭据存储不可用时必须仍有回退），已写入文档注释。Windows 分支显式返回不支持并回退
        TOML，非静默失败。
      truncated: false
  - id: A10
    source: brief.md
    text: 'A10: `ResponseApiProvider` and `CustomApiProvider` produce real streamed
      responses through the existing `LlmProvider` trait instead of returning a
      placeholder error, and neither contains a "尚未实现" path.'
    result: passed
    reason:
      text: 第三轮独立验证通过。Custom 复用已验证的兼容适配器而非复制 HTTP 逻辑，避免超时/错误/协议两份实现漂移；代价是它只能覆盖 OpenAI
        兼容形态的自定义接口（这是 F-07 原文对第三方的定义）。
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: `context_strategy` selects the built-in provider at startup, and a
      strategy without an implementation surfaces a configuration error rather
      than falling back to another strategy."
    result: passed
    reason:
      text: 第三轮独立验证通过。静默回退会让误配置的项目看起来完全正常，故选择启动失败并给出可操作提示。
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: `requirements.md` F-04 no longer claims read-only operations are
      auto-approved, and the correction is limited to claims contradicted by the
      shipped code."
    result: passed
    reason:
      text: 第三轮独立验证通过。按已交付的更严格行为收敛文档，代码未改。
      truncated: false
  - id: A13
    source: brief.md
    text: "A13: Each of the seven deferral groups (R2-2, the R3 tier, the R4 tier)
      records what it defers and why, so no entry in the gap report has an
      unstated disposition."
    result: passed
    reason:
      text: 第三轮独立验证通过。每条延后都指向具体的阻塞决策编号，而非笼统的「后续再做」。
      truncated: false
  - id: A14
    source: brief.md
    text: "A14: `cargo check --workspace` and `cargo test --workspace` both pass."
    result: passed
    reason:
      text: 第三轮独立验证通过。本变更触及 44 个文件、约 2907 行新增。
      truncated: false

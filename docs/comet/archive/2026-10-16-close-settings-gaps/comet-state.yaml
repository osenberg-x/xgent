      passed|failed|blocked, so Runtime rejected it as invalid-data and CLOSED
      that verifier attempt; the corrected file could no longer attach. Nothing
      about the implementation was contradicted — Runtime's own instruction now
      is to resubmit this candidate and re-dispatch a Verifier, which is what
      this handoff does.


      Two seams that same Verifier found by reading the code are fixed here
      rather than argued about:

      1. apply_save_result dropped the post-save re-read error
      (SnapshotResult.error), so a daemon that was reachable for the writes but
      failed the read-back left the panel's top error line stale. drain_save now
      lands ready.error in the same branch that advances tick (only a rebuild
      renders that line), and deliberately does NOT touch the resource when a
      key was rejected — a rebuild there would wipe the rejected value the user
      must still see, and in that case the per-key report is what explains the
      outcome. Both halves are asserted by
      a_clean_save_surfaces_a_re_read_failure_and_a_rejected_one_does_not;
      mutant M45 (delete the assignment) fails it.

      2. Stale evidence numbers: A1's note still said settings_panel_values ->
      18 passed (that suite is 19 now); corrected, and every per-crate number
      below was re-run on this candidate.



acceptance:
  - id: A1
    source: brief.md
    text: '**A1**: opening the panel with a config that sets
      `providers.openai.api_base = "https://example.test/v1"` and `[agent]
      max_parallel_tools = 2`, and a config that sets nothing, each render those
      actual values; an unset numeric field shows the built-in effective default
      (`4` for `max_parallel_tools`) and states that it is not set. This holds
      for the existing four provider fields too — reopening the panel no longer
      shows blanks.'
    result: passed
    reason:
      text: "Read settings_panel.rs::spawn_panel/NumField::display_value and ran the
        cited cases by name: panel_opens_with_the_stored_values,
        reopening_the_panel_redraws_the_same_values,
        unset_field_shows_effective_default_and_says_so all pass. Unset Sentinel
        fields render the effective value (4 / 8000) plus the
        settings-field-unset hint; set fields render the stored value. The four
        provider fields now bind from GlobalConfigRes, so reopening is no longer
        blank. drain_snapshot is the filler and it preserves fields the panel
        does not read."
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2**: the tool-policy row for `read_file` under default configuration
      shows 询问 (`NeedsConfirmation`); after saving 自动执行 it shows 自动执行,
      `[tool_policy] approved = [\"read_file\"]` is on disk in
      `.xgent/config.toml`, and `model_context`/`resolve_policy` for a `Read`
      tool with that policy answers `Approved`. `editor.open_file` (`UiOnly`)
      shows 自动执行 without any configuration (R3-15's finding must stay visible to
      the user)."
    result: passed
    reason:
      text: "policy_rows_display_the_resolved_answer and
        executor::resolved_policy_agrees_with_execution_rules pass by name; rows
        come from executor.policy_targets() and fold via
        stored_state/resolved_policy, i.e. the same resolve_policy precedence
        that decides execution, so a Read tool with empty config displays Ask
        and UiOnly editor.open_file displays Auto with no configuration. Disk
        half verified independently:
        project_tool_policy_lists_replace_and_persist reads tool_policy.approved
        back from <root>/.xgent/config.toml, and
        changed_fields_are_written_with_their_daemon_keys shows the UI emits the
        daemon key names."
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3**: setting `run_command` to 拒绝 writes `tool_policy.denied`, and the
      next `ToolExecutor::execute` for it returns a `denied` result without
      touching the confirmation channel."
    result: passed
    reason:
      text: "denied_tool_is_refused_after_policy_handle_changes passes by name and,
        unlike earlier rounds, now exercises run_command itself as well as
        read_file: pushing the id into the shared policy handle yields
        ToolResult denied+is_error while the counting confirmation callback
        records zero requests, so the confirmation channel is untouched.
        policy_lists emits tool_policy.denied and the daemon test proves it
        lands."
      truncated: false
  - id: A4
    source: brief.md
    text: '**A4**: setting `run_command` to 自动执行 does **not** silence confirmation
      for a dangerous command: `resolve_policy("run_command", Exec,
      {"command":"rm -rf /"}, …)` still answers `NeedsConfirmation` while a
      plain command answers `Approved` (the dynamic-escalation branch of
      `security.rs:38-45` must survive the UI).'
    result: passed
    reason:
      text: "approved_run_command_still_confirms_dangerous_input passes: with
        run_command in approved, a plain command produces 0 confirmations and rm
        -rf produces 1. Read security.rs myself: the dynamic-escalation branch
        that upgrades an Approved exec tool per-input is untouched by this
        change, and the UI only ever writes the two lists via policy_lists,
        never a per-input override."
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5**: the UI never writes the same tool id into both `approved` and
      `denied`: choosing a third state removes the id from the other list, so a
      tool that was 自动执行 and becomes 拒绝 lands only in `denied`."
    result: passed
    reason:
      text: "Structural, and I confirmed it in code: PolicyState is a single
        three-valued enum per row, so one tool id cannot be in both states in
        the draft; policy_lists emits an id into at most one list and skips Auto
        for tools whose default already is Auto.
        choosing_a_state_clears_the_other_lists and
        policy_rows_fold_into_two_lists_without_redundant_entries pass, showing
        Auto->Deny lands only in denied."
      truncated: false
  - id: A6
    source: brief.md
    text: '**A6**: changing `max_parallel_tools` to `1` at runtime makes the next
      tool-call batch observe a maximum of one call in flight, and changing
      `retrieval_max_tokens` to `500` makes the next retrieval request carry
      `max_tokens: 500`, both without rebuilding the bridge or restarting;
      writing `0` instead means "unset" and resolves back to `4`/`8000`, never
      to unlimited (the R3-17 trap).'
    result: passed
    reason:
      text: "max_parallel_tools_written_to_handle_bounds_next_turn (observed in-flight
        maximum 1 after set_run_settings on a bridge built with 4, all four
        results present) and
        retrieval_budget_written_to_handle_reaches_next_query (budget 500 seen
        at the retrieval call, 8000 supplied at assembly) pass by name, both
        without rebuilding the bridge. The R3-17 trap is closed on both sides:
        apply_snapshot_returns_to_defaults_when_unset_again resolves 0 back to 4
        and max_parallel_tools_zero_means_default_not_unlimited keeps the
        storage rule."
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7**: changing `confirm_timeout_secs` to `1` at runtime makes the
      *next* confirmation request expire in about a second instead of 300;
      changing `command_timeout_secs` to `1` makes the *next* `run_command` kill
      a slow command at about a second instead of 60."
    result: passed
    reason:
      text: confirm_timeout_written_to_handle_expires_next_request passes (handle
        starts at 300s, written to 1s, next request expires with the i18n'd
        timeout text);
        command_timeout_written_to_shared_handle_applies_next_call and
        output_cap_written_to_shared_handle_applies_next_call pass, both
        observing the new value on the second call of the same tool instance.
        Confirmed in code that RunCommand and the executor share one
        Arc<RwLock<ToolParams>> written by settings_io::apply_snapshot.
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8**: changing `context.tree_max_depth` to `1` at runtime makes the
      next directory-tree summary shorter than the default depth-4 summary, and
      `context.max_keywords` to `2` makes the next keyword extraction keep at
      most 2 keywords in order."
    result: passed
    reason:
      text: retrieval_limits_written_to_shared_handle_apply_next_retrieve and
        keyword_cap_written_to_shared_handle_applies_next_retrieve pass by name
        through the public retrieve(), i.e. the value is read at the point of
        use, not cached; the pre-existing
        configured_keyword_cap_keeps_first_in_order still passes unchanged, and
        OnDemandProvider holds one shared RetrievalLimits that apply_snapshot
        writes.
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9**: a field holding `abc`, a value above its documented cap, and a
      field left empty are handled distinctly: the first two produce a per-field
      i18n'd error and no write at all; the empty one is a valid \"unset\" that
      writes `0`. If the daemon rejects one key mid-batch, the report names the
      keys already written and the failed key with its reason, and the panel
      stays open with the failed value still visible."
    result: passed
    reason:
      text: "All four clauses verified independently. (a) No write at all:
        handle_save_button validates every SettingsNumInput before touching msg,
        collects rejected, and returns before writer.write;
        invalid_number_blocks_the_whole_save asserts saved_messages is empty and
        the status line names the field and the i18n'd reason; over-cap takes
        the identical Err branch and field_error_text renders
        settings-error-out-of-range with the max. (b) Empty writes 0: proven on
        the emitted message, not only in the parser --
        changed_fields_are_written_with_their_daemon_keys asserts the ConfigItem
        for the emptied tools.confirm_timeout_secs carries json!(0). (c) Naming:
        apply_save_report renders settings-written-keys with ev.written joined
        by the corpus settings-list-sep, then settings-failed-prefix and per-key
        settings-failed-item with the daemon reason;
        partial_save_reports_written_and_failed_keys asserts both landed key
        names, the failed key, the reason, and explicitly that no bare count
        digit appears. (d) Rejected value stays visible: I re-derived the
        ordering myself. toggle_panel gates only on snapshot.tick >
        *last_rendered (Local<u32>) and never calls is_changed(); drain_save
        advances tick and lands ready.error only when report.failed is empty and
        otherwise never deref_mut's ready. I confirmed in ../bevy
        change_detection/traits.rs that DerefMut::deref_mut calls set_changed()
        unconditionally and that merely acquiring ResMut does not, so a failed
        save leaves the resource untouched and the panel cannot be rebuilt out
        from under the edit. Ran the three app cases plus the panel case by
        name: a_failed_save_leaves_the_rejected_value_in_the_real_panel_frame
        (real SettingsPanelPlugin plus real drain_snapshot/drain_save in one
        App), drain_save_advances_the_render_counter_only_when_every_key_landed,
        a_clean_save_surfaces_a_re_read_failure_and_a_rejected_one_does_not,
        failed_save_keeps_the_rejected_value_on_screen -- all pass, and the
        panel stays open in both."
      truncated: false
  - id: A10
    source: brief.md
    text: "**A10**: `config.read`/`config.write` with `scope=project` and a project
      root return and persist `[tool_policy]`/`[agent]`/`[tools]`/`[context]`
      values in `<project>/.xgent/config.toml`, reject an unknown key with `未知配置
      key` exactly as the global path does, and broadcast `config.changed` only
      to clients subscribed to that project (a second window on a different
      project is not notified). `scope=project` without a resolvable root is
      rejected rather than silently treated as global."
    result: passed
    reason:
      text: "Ran the cited daemon cases by name under the mandated sandboxed HOME:
        project_write_lands_on_disk_and_reads_back,
        project_read_of_whole_config_covers_every_section (all four sections),
        project_read_seeds_from_disk_on_first_access,
        project_cache_is_per_root_not_shared,
        project_unknown_key_reads_null_and_write_errors,
        project_config_write_notifies_only_that_projects_subscribers,
        project_config_without_root_is_rejected_not_downgraded,
        project_config_with_missing_directory_is_rejected -- all pass, so the
        file path, the per-root cache, the unknown-key rejection and the
        root-scoped broadcast are behaviourally covered.
        legacy_wire_without_project_root_still_parses passes, confirming old
        clients are unaffected."
      truncated: false
  - id: A11
    source: brief.md
    text: "**A11**: writing `providers.openai.context_window = 32000` over IPC
      succeeds (it is no longer `未知配置 key`), invalidates the provider pool as
      other `providers.*` writes do, and the next conversation's compaction
      decision uses the new window; `max_output_tokens` and
      `first_event_timeout_secs` round-trip through the daemon and reach the
      provider built for the next request."
    result: passed
    reason:
      text: "write_provider_context_limit_fields_reach_config passes
        (context_window/max_output_tokens/first_event_timeout_secs write, read
        back, land in the coordinator and resolve),
        provider_write_invalidates_the_pool_cache and
        non_provider_write_keeps_the_pool_cache pass so invalidation is scoped
        to providers.*, and unknown_global_provider_field_still_errors plus
        model_context_windows_is_readable_but_not_writable_as_a_field bound the
        whitelist. The compaction clause is behavioural, not handle-only:
        runtime_narrowed_window_drives_the_next_compaction_decision passes, and
        I checked xgent_provider myself for the claim it reaches a built
        provider -- build_provider_passes_new_config_keys passes (that crate's
        whole suite is green, 50 tests, although A14 never listed it)."
      truncated: false
  - id: A12
    source: brief.md
    text: "**A12**: a second UI window on the same project, without any interaction
      of its own, updates its displayed values and its live tool policy after
      the first window saves — driven by `config.changed`;
      `GlobalConfigRes`/`ProjectConfigRes` reflect the new state."
    result: passed
    reason:
      text: "Each link verified where it lives and by name: daemon-side routing
        (project_config_write_notifies_only_that_projects_subscribers, carries
        project_root and scope), the receiving window's filter
        concerns_root_filters_peer_changes_by_scope_and_root,
        apply_snapshot_replaces_every_handle for the live policy, and
        drain_snapshot which writes GlobalConfigRes/ProjectConfigRes and always
        advances tick, so an untouched window repaints.
        snapshot_refresh_keeps_the_pending_policy_choice guards the draft across
        that repaint. Boundary, not a defect: no test launches two GUI
        processes."
      truncated: false
  - id: A13
    source: brief.md
    text: "**A13**: every new user-visible string exists in both
      `crates/xgent_settings/locales/zh-CN/main.ftl` and `.../en-US/main.ftl`,
      punctuation included; deleting one key from `en-US` fails the guard test,
      and the English panel renders no Chinese punctuation."
    result: passed
    reason:
      text: "I read the guard rather than trusting it:
        every_panel_key_exists_in_both_locales harvests settings-* literals from
        the real source via include_str! and asserts each renders differently
        from its own name in BOTH bundles, which is exactly a
        delete-a-key-from-en-US failure (Localizer falls back to the key).
        settings-written-keys is a literal at settings_panel.rs:1706 so it is in
        the scanned set, and I confirmed the values by hand: zh 已写入：{ $keys } /
        en written: { $keys }. On the Fluent isolation marks the suite compares
        through a visible() helper that strips U+2066..U+2069, and
        punctuation_belongs_to_the_corpus_not_to_rust renders
        settings-failed-item with real arguments in both locales (a：b / a: b),
        so the key names are present contiguously rather than swallowed; the
        report's separators and colons come from settings-list-sep /
        settings-report-sep, never Rust literals, and
        english_panel_text_has_no_cjk_except_language_names plus
        config_write_errors_avoid_fullwidth_punctuation keep Chinese punctuation
        out of the English path. 3 i18n tests pass by name. Caveat reported
        below: daemon rejection reasons are still Chinese prose surfaced
        verbatim inside the English report."
      truncated: false
  - id: A14
    source: brief.md
    text: "**A14**: `cargo test -p xgent_settings_core --lib`, `-p xgent_daemon
      --lib`, `-p xgent_tools --lib`, `-p xgent_context --lib`, `-p xgent_agent
      --lib`, `-p xgent_ui --lib`, `cargo test -p xgent_ui --test
      settings_input_focus`, `cargo check --workspace --all-targets` and `cargo
      fmt -p <crate> -- --check` for every touched crate pass, with all
      pre-existing tests untouched in behaviour. The GUI-only paths (actual
      mouse interaction with the new rows) are recorded as such rather than
      claimed."
    result: passed
    reason:
      text: "Runtime c1-c13 are bound evidence for this candidateId (all suites, cargo
        check --workspace --all-targets, per-crate fmt). I additionally re-ran
        by name rather than trusting the handoff: every test name cited in it
        greps to real source (the two that did not were my own transcription
        truncations -- the real names are
        project_unknown_key_reads_null_and_write_errors and
        english_panel_text_has_no_cjk_except_language_names), and the quoted
        numbers are true: settings_panel_values 19 / settings_panel_i18n 3 /
        settings_input_focus 2, xgent_app 21 total (11 in-bin, confirmed
        independently by the filtered-out count), xgent_ui 114 total,
        xgent_daemon 54, xgent_tools 136, xgent_context 44, xgent_agent 74.
        Safety re-verified by me, not claimed: md5 of
        /Users/xdo/.xgent/agent/config.toml is e1ea7dffa427cf1fb72b0b82e2654e6c
        before and after the daemon runs and /tmp/xgent-daemon-test-home stayed
        empty. A14's own text records the GUI-only pointer paths as boundaries
        rather than claims, and they are indeed recorded. Note taken:
        xgent_daemon is bin-only so the executed form is cargo test -p
        xgent_daemon, as the handoff states."
      truncated: false

  summary:
    text: "Independent read-and-run verification of candidate 3790d1ed against
      A1..A14, all 14 items assessed exactly once. Verdict pass. A9 is genuinely
      closed and I re-derived its ordering story rather than accepting it:
      toggle_panel rebuilds only on a SettingsSnapshotReady.tick delta
      (Local<u32>) with no is_changed() anywhere in the panel; drain_save
      advances tick and lands ready.error only when report.failed is empty and
      otherwise never derefs the resource; I confirmed in ../bevy that
      ResMut::deref_mut marks changed unconditionally while acquisition does
      not, which is what killed round 3. All four A9 clauses are pinned at the
      message/status level (no write for abc and over-cap, empty emits json!(0),
      landed keys named by name with the failed key and reason, panel open,
      rejected value still on screen), including a real-frame test with the real
      SettingsPanelPlugin plus the real drain_snapshot/drain_save. The M40/M41
      asymmetry is confirmed real and structural -- xgent_app is bin-only, so
      its harness is unimportable from xgent_ui. Both-locale rendering of
      settings-written-keys verified with the U+2066..U+2069 isolation marks
      accounted for. Every Builder-cited test name greps to source and passes by
      name; quoted suite counts (19/3/2, app 21, ui 114, daemon 54, tools 136,
      context 44, agent 74) all matched; the developer config md5 held at
      e1ea7dffa427cf1fb72b0b82e2654e6c before and after the sandboxed daemon
      runs and the fake home stayed empty. No repo file was touched by me: git
      status --porcelain is byte-identical to the capture taken before my first
      Runtime action, and no probe or mutant was built (Verify is read-only, so
      I verified the mutant claims by reading code and Bevy's change-detection
      implementation instead of executing them). Remaining items are boundaries,
      most already recorded: headless pointer interaction, no two live GUI
      processes, daemon reasons still Chinese prose, count-only toast on the
      closing success path, no top-line reason on a partially-failed save, plus
      two I found and the handoff does not list -- panel rows do not pick up
      tools registered after it was built, and a theme change does not repaint."
    truncated: false
  risks:
    - text: "A9/M40 asymmetry is real, not a hole, and I verified it independently:
        M40 (reverting the panel gate to is_changed()) is caught only by
        xgent_ui/tests/settings_panel_values.rs::failed_save_keeps_the_rejected\
        _value_on_screen, because the app's drain_save no longer touches
        SettingsSnapshotReady at all on a failed save, so the app-side frame
        never exhibits 'dirty resource with unmoved tick'. The panel test
        manufactures that state deliberately and more strictly than production
        does. M41 (advance tick without checking failed) is caught only in
        xgent_app for the mirror reason. The Builder's structural argument holds
        and is in fact stronger than stated: xgent_app is a bin-only crate (no
        lib target, Cargo.toml has no [lib]), so its private settings_io::tests
        harness is not importable from xgent_ui tests at all -- not even through
        Cargo's cycle-tolerant dev-dependencies. The composition is still
        covered, by
        a_failed_save_leaves_the_rejected_value_in_the_real_panel_frame running
        the real SettingsPanelPlugin and the real drain_snapshot/drain_save in
        one App. Residual exposure is only for a future third producer of
        SettingsSnapshotReady that dirties it without advancing tick; today
        drain_snapshot is the only other one and it always advances."
      truncated: false
    - text: "Tick-delta repaint, assessed against the committed baseline rather than
        the intermediate rounds: at HEAD toggle_panel had no rebuild gate at all
        (spawn on open, despawn on close), so nothing that used to repaint can
        have stopped repainting -- the gate is strictly more responsive than
        pre-change behaviour. Language switch repaints (save_language ->
        read_both -> drain_snapshot, which advances tick unconditionally); peer
        config.changed repaints; a successful save repaints; reopening always
        spawns fresh and resyncs last_rendered. Two things still do not repaint
        while the panel is open, and I found neither documented in the handoff:
        newly registered tools (plugin proxy tools appearing after the panel is
        built, since rows are snapshotted from executor.policy_targets() at
        spawn) and a Theme change (preferences.theme has no consumer and only
        one dark preset exists, so no user-visible impact today). Both are also
        unfixed at HEAD, so they are boundaries, not regressions -- but the
        tool-row one deserves an explicit note in doc/dev-tutorial.md."
      truncated: false
    - text: "English report text can still contain Chinese words, though no Chinese
        punctuation: daemon rejection reasons are surfaced verbatim, and A13's
        no-CJK guard only scans corpus values, not runtime-injected daemon
        strings. Recorded by the Builder as out of scope (needs an error-code
        protocol), but a user sees it."
      truncated: false
    - text: The closing success path still reports a count only (settings-saved-count
        toast) while the panel closes; naming exists only on the report that
        stays on screen. Consistent with the spec's 'some keys land, one fails'
        wording, but the acceptance sentence's 'names the keys already written'
        is satisfied only on the failure path.
      truncated: false
    - text: On a partially-failed save the post-save re-read error is deliberately not
        written to the panel's top line, because rendering it requires the
        rebuild that would erase the rejected value; the per-key report carries
        the outcome instead. A clean save with a failed re-read does surface it
        (a_clean_save_surfaces_a_re_read_failure_and_a_rejected_one_does_not).
        Documented, a real trade-off, not silent loss.
      truncated: false
    - text: "A14's 'pre-existing tests untouched in behaviour' is met in substance but
        not literally:
        crates/xgent_ui/tests/settings_input_focus.rs::settings_panel_input_acc\
        epts_typing no longer drives the real PointerPress -> AcquireFocus ->
        InputFocus chain; it now sets InputFocus directly and the TabIndex
        contract moved into every_settings_input_carries_tab_index. The click
        mechanism itself remains covered generically by the pre-existing
        interaction_model.rs::click_focuses_text_input_with_tab_index (7 tests
        in that target pass). No test was deleted or #[ignore]d and no other
        pre-existing test lost assertions, so I treated it as the recorded
        GUI-only boundary the acceptance text allows -- but the panel-specific
        click-to-focus wiring has no automated guard, and the Builder's stated
        cause (headless produces no child-node coordinates without a UiRoot) is
        a claim I could not reproduce or refute without editing code, which
        Verify forbids."
      truncated: false
    - text: No two live GUI processes are run anywhere, and no real-provider latency
        or cost is measured. A10/A11/A12 are therefore proven link-by-link where
        each lives, not end-to-end across processes.
      truncated: false
    - text: "Process note for the record: two earlier rounds had claimed-but-absent
        tests and stale counts. This candidate has none that I could find --
        every cited name exists and passes, and every quoted number matched. The
        only inaccuracies were introduced by my own truncation of two names,
        corrected above."
      truncated: false
  risks_truncated: false

acceptance:
  - id: A1
    source: brief.md
    text: 'A1: `search_files` called with only `pattern` returns the same matches,
      the same `path:line: text` format, the same ignored-directory behavior,
      the same "未找到匹配" text and the same truncation notice as before this
      change; the pre-existing `search_files` tests pass unmodified.'
    result: passed
    reason:
      text: search_files.rs default is Matcher::Literal (substring, case-sensitive);
        format/ignored dirs/MAX_RESULTS=200/MAX_DEPTH=16/1MB skip/truncation
        notice and pre-existing tests (search_finds_matches, search_no_match,
        search_ignores_target_dir) unchanged. Cancellation still
        ToolError::Aborted (abort_during_filtered_search_returns_aborted).
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: with `"regex": true`, `"pattern": "^fn\\s+\\w+"` matches lines by
      regular expression. With `"regex": true` and an invalid pattern such as
      `"(foo"`, the result is `is_error`, its output names the `pattern`
      argument and the reason, and no file in the project is opened or traversed
      — in particular it does not return "未找到匹配".'
    result: passed
    reason:
      text: compile_matcher builds Regex before walk;
        invalid_regex_is_reported_before_traversal pre-cancels the token — error
        (naming 'pattern', not 未找到匹配) only reachable if compilation precedes
        traversal. regex_mode_matches_by_pattern pins ^fn\s+foo_\w+.
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: `"case_insensitive": true` matches `FOO`, `foo` and `Foo` in both
      literal mode and regex mode, and with the flag absent (default) matching
      stays case-sensitive.'
    result: passed
    reason:
      text: "case_insensitive_applies_to_both_modes: folded literal +
        RegexBuilder.case_insensitive; asserts 3 hits with flag (both modes) and
        1 without. Non-default-value discriminating."
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: `"glob": "*.rs"` searches only `.rs` files at any depth, `"glob":
      "src/**/*.rs"` searches only `.rs` files under `src/`, a pattern with
      unbalanced braces is reported as `is_error` naming the `glob` argument
      with no traversal, and a file whose path does not match the glob
      contributes no line even when its content matches.'
    result: passed
    reason:
      text: glob.rs self-written translation; glob compiled in execute() before walk.
        invalid_glob_is_reported_before_traversal (pre-cancel + 'glob' + no
        未找到匹配). glob_and path/name tests (glob_extension_filter_narrows_files,
        glob_path_filter_with_globstar) + glob.rs unit tests.
      truncated: false
  - id: A5
    source: brief.md
    text: 'A5: `"file_type": "rust"` restricts the search to the extension set
      behind `rust`, `"file_type": "unknown_kind"` returns `is_error` listing
      the supported type names, and `file_type` combined with `glob` requires
      both to match.'
    result: passed
    reason:
      text: FILE_TYPES map + type_extensions; unknown_file_type_lists_supported_names
        (lists 'rust', no 未找到匹配; valid-type-no-hit is normal empty).
        file_type_filter_selects_extensions and glob_and_file_type_intersect
        (keeps_file checks ext AND glob before any read).
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: with `[providers.openai] context_window = 32768` and no per-model
      entry, the agent's compaction threshold is computed from 32768; adding
      `[providers.openai.model_context_windows] \"gpt-4o\" = 128000` while
      running model `gpt-4o` makes the agent use 128000 instead; with neither
      set, the agent uses 128000 and prints one startup warning naming the
      fallback."
    result: passed
    reason:
      text: resolve_context_window precedence model>provider>128000+fallback flag
        (context_window_precedence..., global_resolve..._missing_provider);
        main.rs feeds window into AgentBridgeConfig and tracing::warn names
        model+fallback on flag. compaction uses cfg.context_window
        (compaction_triggers_when_over_threshold, window=10).
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: setting `[agent] retrieval_max_tokens = 2000` makes the context query
      the agent issues carry `max_tokens = 2000`, and setting `[agent]
      max_events_per_frame = 8` makes the agent loop drain at most 8 events in
      one frame; with the section absent both use 8000 and 64, and no literal
      `64` remains in the drain loop's bound."
    result: passed
    reason:
      text: bridge.rs ContextQuery.max_tokens=cfg.retrieval_max_tokens
        (retrieval_budget_from_config_reaches_context_query asserts 2000).
        agent_loop.rs drain uses bridge.max_events_per_frame (no literal 64);
        frame_event_cap_defers_events_without_dropping_them (cap 3, full concat)
        + drain_bound_is_read_from_bridge_not_a_literal. Absent=8000/64
        (project.rs serde test).
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: setting `[tools] command_timeout_secs = 5` kills a command that
      outlives 5 seconds, `[tools] command_max_output_bytes = 1024` truncates
      captured output to at most that many bytes, `[tools] confirm_timeout_secs
      = 2` times a pending confirmation out after 2 seconds; with `[tools]`
      absent the values are 60, 65536 and 300."
    result: passed
    reason:
      text: ToolParams->RunCommand(timeout/cap) & ToolExecutor(confirm).
        configured_command_timeout_kills_slow_command (Timeout(1),<3s),
        configured_output_cap_truncates_capture (1024 vs default),
        configured_confirm_timeout_expires (NeverAnswers + 1s -> 确认请求超时),
        abort_beats_confirm_timeout (biased select, Abort wins at 200ms).
        Absent=60/65536/300 asserted.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: setting `[providers.anthropic] max_output_tokens = 4096` puts
      `max_tokens: 4096` in the Anthropic request body, and `[providers.x]
      first_event_timeout_secs = 1` makes the first-event wait use one second in
      both the OpenAI-compatible and the Anthropic adapter; absent, the body
      carries 8192 and the wait is 30 seconds."
    result: passed
    reason:
      text: build_provider passes with_max_output_tokens/effective + 2x
        with_first_event_timeout_secs (build_provider_passes_new_config_keys
        source-locked). max_output_tokens_from_config_reaches_request_body
        (4096/8192/0->8192). End-to-end stalling-SSE first-event-timeout tests
        in anthropic.rs and openai_compat.rs assert ~1s not 30s.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: setting `[context] tree_max_depth = 2`, `tree_max_entries = 5`,
      `rg_timeout_secs = 1`, `max_search_files = 1`, `max_keywords = 2` changes
      the built-in retrieval provider's behavior accordingly (shallower and
      smaller tree, fewer searched files, at most two keywords); absent, the
      limits are 4, 200, 10, 20 and 16 — the constants they replace."
    result: passed
    reason:
      text: RetrievalLimits read at use sites (tree_max_depth/entries, rg_timeout_secs
        Duration, max_search_files take/cap, max_keywords truncate) +
        retrieval_limits_are_actually_read source-assert. Behavior tests use
        non-default values vs default. from_context_limits wired via
        build_context_provider->with_limits.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: `cargo test -p xgent_settings_core -p xgent_provider -p xgent_tools
      -p xgent_context -p xgent_agent`, `cargo test -p xgent_ui` and `cargo
      check --workspace --all-targets` pass, so the new configuration types and
      the widened tool and bridge constructors did not break `xgent_app`,
      `xgent_daemon` or `xgent_plugin_host`."
    result: passed
    reason:
      text: Runtime c1-c7 all exit 0 (per-crate lib tests + cargo check --workspace
        --all-targets + fmt over 7 crates); widened constructors compile across
        xgent_app/daemon/plugin_host per c6.
      truncated: false

  summary:
    text: "[repair round 3: c1 (cargo test -p xgent_settings_core --lib) failed on
      two pre-existing flaky tests, paths::tests::session_file_path_layout and
      paths::tests::sessions_db_under_agent_dir — both assert against
      agent_dir()/sessions_dir() while sibling tests flip XGENT_AGENT_DIR
      in-process, and neither held ENV_LOCK (the previous round's lock fix
      covered only two of the four path-reading tests). Added the missing
      guards; 43 passed 3x consecutively. Note on evidence: re-removing one
      guard did not reproduce the failure locally in 3 runs, so the guard's
      value rests on the observed Runtime failure plus the mutual-exclusion
      argument, not on a demonstrated mutant. No behaviour or API change in this
      round. ] Two ledger entries closed. (1) R3-3: xgent_tools search_files now
      matches with an opt-in regex (regex=false keeps literal substring,
      case-sensitive), honours case_insensitive in both modes, filters files by
      glob (self-written glob->regex: * not crossing /, ** crossing, ? one char,
      {a,b}; a pattern without / matches the file name only) and by named
      file_type (ripgrep --type vocabulary). A malformed regex, a malformed glob
      or an unknown file_type returns is_error naming the argument BEFORE any
      traversal, so a bad query can no longer masquerade as '未找到匹配'. Output
      format, ignored dirs, 1MB per-file skip, MAX_DEPTH/MAX_RESULTS and
      cancellation boundaries are unchanged; filtered-out files are never read
      and never consume the result cap. (2) R3-17: all 13 limits named by the
      ledger are now configuration (14 keys). ProviderConfig gains
      context_window, model_context_windows, max_output_tokens,
      first_event_timeout_secs; ProjectConfig gains [agent] retrieval_max_tokens
      + max_events_per_frame, [tools] confirm_timeout_secs +
      command_timeout_secs + command_max_output_bytes, [context]
      tree_max_depth/tree_max_entries/rg_timeout_secs/max_search_files/max_keyw\
      ords. Defaults equal the replaced constants item by item (asserted as
      serde data, not by reading default fns); 0 means unset. Wiring:
      GlobalConfig::resolve_context_window (per-model > provider > 128000 with a
      startup warn) -> AgentBridgeConfig; ToolParams::from_tool_config ->
      ToolExecutor::with_params + default_tools(&ToolParams) +
      RunCommand::with_params; RetrievalLimits::from_context_limits ->
      OnDemandContextProvider::with_limits; build_provider +
      CustomApiProvider::with_config pass the provider keys; per-frame cap is an
      AgentBridge field read by the drain loop. SIDE EFFECT FOUND BY THE A8
      BEHAVIOUR TEST AND FIXED: the 300s confirmation timeout only wrapped 'hand
      me the receiver' (BridgeConfirm::confirm returns immediately), so rx.await
      was unbounded and the 确认请求超时 branch was unreachable in production; the
      timeout now wraps both halves with biased cancellation so Abort still
      wins, and xgent_ui confirm_dialog::close_on_settled closes the modal when
      the request settles (otherwise it keeps eating keyboard focus with its
      buttons wired to a dropped receiver). Behaviour change to note: an
      unanswered confirmation now ends in 确认请求超时 instead of hanging the
      conversation forever."
    truncated: false

  - id: A1
    source: brief.md
    text: 六个静态层根存在且 z 值来自 `theme::z`；业务代码中 `GlobalZIndex(` 只出现在 `layout.rs`/`kit.rs`
      的层根 spawn 与 `modal.rs` 的栈深派生处。
    result: passed
    reason:
      text: layout.rs 在 UiRoot 下并列 spawn BASE/DOCK/DRAWER/DROPDOWN/TOOLTIP/TOAST
        六个层根，均走 kit::layer_root（Node 全屏绝对定位 + GlobalZIndex(band) +
        BackgroundColor::NONE + LayerRoot(band)），TopBar/MainArea/StatusBar 为
        BASE 层根子节点。grep GlobalZIndex( 仅命中
        layout.rs:125、kit.rs:190/198/203/658、modal.rs:171，全部取 theme::z
        常量或栈深派生，无业务裸写数字。layout.rs
        两个单测（six_layer_roots_have_expected_z_and_no_pickable、main_regions_live_under_base_layer）本轮独立重跑通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "`UiPickingSettings.require_markers == true`；层根与布局壳不带 `Pickable`；所有带
      `Button` 组件的实体都带 `Pickable`；空层根不吞点击。"
    result: passed
    reason:
      text: xgent_app/main.rs:260-264 装配
        UiPickingSettings{require_markers:true}；layer_root 不含 Pickable（layout
        测试断言 LayerRoot 实体 0 个带 Pickable），布局壳/装饰节点亦无；picking.rs 的 Added 系统为
        Button 与 EditableText 统一补 Pickable::default()（block+hoverable），46 处
        Added<Pressed> 交互点抽查均为 Button（含 resize 手柄）。空层根不吞点击由 require_markers + 无
        Pickable 结构性成立，现有交互/布局测试无回归。
      truncated: false
  - id: A3
    source: brief.md
    text: 设置面板打开时按 Esc 只关闭面板、不触发 `chat.abort`；确认弹窗在栈顶时独占键盘；模态 z 等于 `400 + depth*8`。
    result: passed
    reason:
      text: 重点复验重建场景：modal.rs:123-128 把 apply_modal_pop 排在 apply_modal_push 之前并
        .chain()，同帧先按 id 移除旧层、再让新实体入栈，故 contains(id) 不再吞掉新面板；入栈时按 stack.len() 写
        400+depth*8（modal.rs:168-171），超 MODAL_MAX_DEPTH 拒绝。Esc 经
        route_modal_input 只作用于栈顶并置 ModalEscConsumed，shortcuts.rs:141-146
        在栈非空/已消费时排空消息，chat.abort 不派发；confirm 以 NotDismissable 入栈且
        confirm_dialog.rs:469-475 以 stack.top()=="confirm" 独占键盘。独立重跑
        modal_settings 3 项（含 rerender_keeps_settings_registered_in_modal_stack）与
        modal 单测 stack_push_pop_and_depth_z 均通过，Esc 场景断言 AbortMessage 计数为 0。
      truncated: false
  - id: A4
    source: brief.md
    text: 通过 rail 文件钮、「+ 添加」、`filepanel.toggle`
      三个入口打开文件抽屉时，历史抽屉自动关闭；反向亦然；设置面板打开时抽屉不遮挡模态。
    result: passed
    reason:
      text: overlay.rs 以 OverlayRegistry + DrawerToggle 单一裁决（同 id 再切即关、开新关旧），rail
        文件/历史钮、context_scope「+ 添加」、filepanel.toggle 快捷键、命令面板历史项、file_panel
        关闭路径全部只发 DrawerToggle，无残留手工互斥；抽屉 z 走 kit::drawer_z()=z::DRAWER(200) <
        MODAL_BASE(400)，设置面板在 400 以上，抽屉不遮挡模态。overlay/activity_bar 互斥测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 最右齿轮钮的 tooltip 完整可见、不被 `MainArea` 的 `Overflow::clip()`
      裁切；右缘空间不足时翻转到左侧；tooltip 实体不在宿主子树内。
    result: passed
    reason:
      text: kit.rs spawn_tooltip_panel 以 ChildOf(TOOLTIP 层根) 挂载，不再作为宿主子节点，因而不受
        MainArea/ChatPanel 的 Overflow::clip() 影响；实体带
        Pickable{should_block_lower:false,is_hoverable:false}；position_tooltips
        每帧按宿主 ComputedNode/GlobalTransform 定位，tooltip_left 在
        host_right+gap+tip_width>viewport 时翻转到左侧（含 0
        下限）。tooltip_flips_at_viewport_edge 单测通过。
      truncated: false
  - id: A6
    source: brief.md
    text: 设置面板按 Esc 与点击遮罩均可关闭；关闭后焦点回到打开前的实体。
    result: passed
    reason:
      text: 设置面板以 Dismiss::EscAndScrim 入栈（settings_panel.rs:1354），Esc 经
        ModalDismissRequested 置 open=false、遮罩 Added<Pressed> 同样置 false，两条路径都由
        toggle_panel 发 ModalPop 并由 apply_modal_pop 把 InputFocus 还原到该层
        opener_focus。重建路径复验：pop 先于 push 使新面板重新以 depth 0 入栈并拿到
        z=400（测试断言），关闭后焦点仍回到打开前实体；独立重跑 esc_closes_settings_through_modal_stack
        通过（焦点断言 opener）。
      truncated: false

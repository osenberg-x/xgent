acceptance:
  - id: A1
    source: brief.md
    text: A1 **符号提取**：对 Rust fixture 解析出函数/结构体/枚举/trait/impl/module
      的符号，名称、种类、文件与起止行正确；函数复杂度可计算；重复解析结果逐位一致。
    result: passed
    reason:
      text: 独立运行 `CARGO_PROFILE_TEST_DEBUG=0 cargo test -p xgent_codeintel -p
        xgent_context` 全绿（codeintel 9/9、context
        54/54）。`extracts_symbols_ranges_and_complexity`
        覆盖函数/方法/结构体/枚举/trait/impl/module/const/static/type alias 的名称与
        kind；`symbol_ranges_match_known_lines` 精确断言 struct 行 1-1、fn 行
        3-5；`scan_is_deterministic_and_incremental` 断言同快照两次扫描 FileEntry 与
        generation 逐位相等。代码侧 `parse_source` 用 tree-sitter 节点位置生成 1-based 起止行、file
        字段写相对路径。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 **import/use 解析**：工作区内 `use`/`mod` 解析到对应文件或模块；外部依赖标记 external
      且不产生工作区文件边；无法解析时不报错。
    result: passed
    reason:
      text: "`resolves_workspace_imports_and_marks_external` 断言 `use
        crate::foo::Hello` 与 `use crate::foo::bar::Nested` 解析到
        src/foo.rs、src/foo/bar.rs，`use external_crate::Thing` 记
        External；`unresolved_imports_stay_unresolved_without_error` 断言
        `crate::missing` 与 `super::up` 记 Unresolved 且无任何 Workspace 边、扫描不报错。`mod
        foo;` 由 `resolve_mod` 尝试 foo.rs / foo/mod.rs（代码核对）。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3 **增量更新**：修改一个文件后只更新该文件的符号/import，其他文件结果不变；删除文件后其符号消失；generation
      随之变化且可重复。
    result: passed
    reason:
      text: "`scan_is_deterministic_and_incremental` 断言 update_file 后其他文件 FileEntry
        逐位相等、新符号可查，remove_file 后符号消失且 generation
        改变；`update_from_disk_handles_removed_files`
        覆盖磁盘删除。update_file/remove_file 均调用 generation_of 重算（代码核对：路径 + 内容 FNV
        哈希确定性聚合）。"
      truncated: false
  - id: A4
    source: brief.md
    text: A4 **RepoMap 检索**：`build_context_provider` 对 `repo_map` 返回
      Ready；以符号/文件/当前文件查询返回相关结构化结果，受 token 预算约束；无结果返回空而不报错。
    result: passed
    reason:
      text: "`repo_map_is_ready` 断言
        build_context_provider(RepoMap)=Ready；`retrieves_matching_symbols`、`fil\

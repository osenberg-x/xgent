        FileChangedEvent 转发给 ContextHub（`cargo check --workspace` 通过，代码核对）。"
      truncated: false
  - id: A6
    source: brief.md
    text: A6 **只读与后台**：索引过程不写项目文件；provider 首次构建在后台执行，查询调用不阻塞 UI 主线程；错误时返回空/降级而非

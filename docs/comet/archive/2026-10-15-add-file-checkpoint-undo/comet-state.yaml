acceptance:
  - id: A1
    source: brief.md
    text: "A1: after `write_file` (and after `edit_file`) succeeds,
      `<project>/.xgent/checkpoints/` contains a manifest entry for that turn
      holding the file's pre-write bytes (or a \"did not exist\" marker), and no
      `<name>.xgent-bak` file is created anywhere; the existing executor test
      that asserted the `.xgent-bak` file is updated to assert the checkpoint
      instead."
    result: passed
    reason:
      text: "I ran cargo test -p xgent_tools --lib myself: 127 passed, 0 failed, and
        saw checkpoint::tests::snapshot_records_pre_state_and_no_backup_file
        assert the manifest entry (kind Modified, post_hash None before the
        write, blob holds 'one'), created_file_is_marked_created_and_has_no_blob
        assert the did-not-exist marker, executor_driven_write_file_is_undone
        drive a real write_file through ToolExecutor, and
        executor::tests::write_tools_record_checkpoints_instead_of_backup_files
        do the same for edit_file. The choke point is genuine: grep over
        crates/xgent_tools/src shows exactly one tool.execute call site,
        executor.rs:106 inside run_tool, and all three branches (Approved,
        AllowAll, post-confirmation Allow) now call self.run_tool while the Deny
        branches return before it. No *.xgent-bak is possible any more because
        backup_existing and backup_path_for no longer exist in atomic.rs (read
        the whole file, 65 lines). Note: the .xgent-bak absence assertions scan
        the project root only one level deep, which is moot given the writer is
        deleted; the old backup assertion was replaced by a new sibling test in
        the same file rather than edited in place."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: within one turn the same file is written three times with contents
      c1→c2→c3; undoing that turn leaves the file with c0 (the content before
      the turn), and the entries are replayed newest-first."
    result: passed
    reason:
      text: "Test three_writes_in_a_single_turn_undo_to_pre_turn_content ran green in
        my own execution: it writes c1,c2,c3 to one file in one turn and asserts
        report.restored == ['a.rs';3] and the file ends at c0, then asserts the
        manifest is gone and has_undoable_turn is false. Newest-first replay is
        real, not just claimed: undo_turn iterates manifest.entries.iter().rev()
        (checkpoint.rs:355) and blob names carry the entry index via blob_name
        (checkpoint.rs:518-528), which is what makes the three distinct
        pre-states c2/c1/c0 addressable."
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: a file the agent created and never had before is deleted by undo; a
      file that existed before the turn but that the user has since deleted is
      NOT recreated, and is reported as skipped."
    result: passed
    reason:
      text: "Three tests I executed: created_file_is_removed_on_undo (report.removed
        == ['brand.rs'], file absent), user_deleted_file_is_not_resurrected
        (skipped == [('old.rs', DeletedByUser)], file still absent, restored
        empty), created_then_deleted_by_user_reports_already_absent
        (already_absent, skipped empty). On 'could undo delete a file the user
        created': I read restore_entry (checkpoint.rs:362-451) - a Created entry
        is only removed after fnv1a64(current) equals the recorded post_hash,
        and is skipped as Unverified when post_hash is missing, so undo cannot
        delete a file whose bytes are not the agent's."
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: if the current bytes of a checkpointed file differ from what the
      agent wrote (the user or a build edited it), undo leaves it untouched,
      still restores the other files of that turn, and its report names the
      skipped path."
    result: passed
    reason:
      text: "Test externally_modified_file_is_skipped_and_others_still_restore ran
        green under my own run: user-edited a.rs stays 'user', b.rs is still
        restored to 'b0', and report.skipped == [('a.rs', ExternallyModified)].
        The report names the path to the user: undo.rs:204-219 renders 'path
        (reason)' pairs into the persisted notice, and
        skipped_files_are_listed_with_reasons asserts the rendered text contains
        'c.rs' plus the reason string. Comparison is by content hash read back
        at undo time, not mtime, as claimed."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: the command palette lists an undo command that is discoverable by
      typing, and invoking it performs the restore; the command id is registered
      through `CommandRegistry::try_register` and routed by
      `handle_palette_triggers`, not through a plugin `plugin.` prefix."
    result: passed
    reason:
      text: "Code-level facts confirmed by reading: command_palette.rs:99-105
        registers id 'agent.undo-changes' with label tr(loc,'cmd-undo-changes')
        through CommandRegistry::try_register inside register_xgent_commands,
        which is wired as a Startup system (command_palette.rs:52);
        handle_palette_triggers has its own arm at line 419 writing
        UndoChangesMessage, placed before the 'id if
        id.starts_with(\"plugin.\")' catch-all, so it cannot route to a plugin
        command; discoverability is structural because
        xui/src/command_palette.rs:126-140 filter_commands matches the query as
        a lowercase substring of c.label. EXPLICIT LIMIT: palette rendering and
        selection are not verifiable headlessly and no test exercises them -
        grep shows no file under crates/xgent_ui/tests references AgentBridge
        and only xgent_app/src/main.rs:254 builds XgentUiPlugin, so
        request_undo/collect_undo_results/append_undo_notice never run in any
        test; only the extracted pure helpers gate/summarize/detail are
        unit-tested. The handoff statement that the undo plugin is in the app
        the integration harness builds is not true."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: undo applies to the newest turn of the current session only; invoking
      it repeatedly walks back turn by turn and finally reports
      nothing-left-to-undo; while the conversation status is not Idle it refuses
      with a message and changes nothing."
    result: passed
    reason:
      text: "Idle refusal: gate_refuses_while_busy_and_without_store (registered and
        run) proves Thinking -> Busy, None -> Unavailable, Idle+store -> Run;
        and in request_undo the reject arm pushes a completed receiver without
        spawning or touching the store (undo.rs:76-80), so nothing on disk can
        change while busy. Session scoping: undo_is_scoped_to_the_session proves
        undo for a session that wrote nothing returns did_nothing while the
        writing session still restores. Walk-back to exhaustion:
        turn_number_continues_after_restart undoes turn 1 then asserts the next
        undo returns did_nothing, and empty_turn_does_not_reuse_turn_number
        undoes turn 3 then turn 1 and lands on v0. Same key on both sides:
        session is conv.id.0 (SessionId(pub u64), xgent_core/src/ids.rs:10) in
        agent_loop.rs:86 for StartLoop and in undo.rs:74 for the gate, never
        parsed from a session:N string."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: a snapshot that could not be recorded (e.g. the checkpoint directory
      is unwritable) does not block the write — the file is still written, the
      tool result still succeeds, and the undo report states that this turn had
      uncovered files instead of claiming full coverage."
    result: passed
    reason:
      text: "Test unwritable_checkpoint_dir_degrades_without_blocking_the_write ran
        green: with the checkpoint root occupied by a regular file,
        uncovered_count() == 1, report.uncovered == ['w.rs'], did_nothing() is
        false (so it does not masquerade as nothing-to-undo), and the target
        file keeps its content. Non-blocking is structural, not just tested:
        snapshot_before_write returns () and handles record errors internally
        (checkpoint.rs:239-253), so run_tool cannot fail because of the store.
        LIMIT I confirmed: the degradation is proven at store level; no
        executor-level test drives an unwritable store while a real write_file
        runs through run_tool."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: more than 20 recorded turns in one session keeps only the 20 newest:
      the oldest manifest and its blobs are gone, and undo still works over the
      retained ones."
    result: passed
    reason:
      text: "Test retention_keeps_only_the_newest_turns ran green: 25 recorded turns
        leave turns_on_disk len 20 with first == 6 and last == 25, and undo over
        the retained set still restores 'v24'. DEFAULT_MAX_TURNS is a named
        constant 20 with no config key, matching the Non-goals. HONEST SPLIT:
        the manifest half is asserted; the 'and its blobs are gone' half is
        established only by my reading of prune (checkpoint.rs:583-592) calling
        delete_turn (571-580), which removes every entry blob before the
        manifest - grep confirms no test ever inspects the blobs directory."
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: undo writes through the same atomic path as the tools (temp file in
      the same directory + rename + `sync_all`), so an interrupted restore
      leaves the file at its previous content, and no `.xgent-tmp` leftovers
      remain; an open clean editor buffer for a reverted file is reloaded by the
      existing filesystem-watch pipeline and a dirty buffer reaches the existing
      conflict dialog rather than being silently replaced."
    result: passed
    reason:
      text: "Atomic restore confirmed by reading: restore_entry writes through
        atomic_write_bytes (checkpoint.rs:442), the same primitive atomic_write
        now delegates to - same-directory tmp derived from the target,
        write_all, flush, sync_all, rename, and tmp removal when rename fails
        (atomic.rs:31-49). No second reload path confirmed by reading all of
        undo.rs: it only calls CheckpointStore and writes
        ToastMessage/UndoNoticeMessage, never FileReadRequest and no editor
        entity mutation. The pipeline it relies on exists as described:
        fs_event_bridge.rs:98-114 bridge_file_changed emits FileChangedEvent,
        and editor/conflict.rs:71-125 handle_file_changed silently reloads on
        BufferState::Clean (FileReadRequest + FileReadPending) and calls
        enter_conflict + spawn_conflict_dialog on Dirty/LocalPreferred, with
        re-entrancy protection. NOT HEADLESS-VERIFIABLE: that the daemon watcher
        fires for an undo-driven write and that a real clean buffer reloads / a
        dirty one shows the dialog - both are reading-level conclusions, exactly
        as the brief's verification expectations prescribe. Also: no test
        asserts absence of *-xgent-tmp leftovers, and the early '?' paths of
        atomic_write_bytes (create/write_all/flush/sync_all failing) return
        before the rename-arm cleanup, so a mid-write failure can leave a tmp
        file - a pre-existing shape, not introduced here."
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: every new user-facing string (palette label,
      success/skipped/nothing-to-undo/busy notices) has keys in both
      `zh-CN/main.ftl` and `en-US/main.ftl`, and no new user-visible string is
      hardcoded in Rust (the existing hardcoded Chinese in `agent_loop.rs:61` is
      not made worse)."
    result: passed
    reason:
      text: "Both catalogues gained exactly the same 16 new keys, confirmed by reading
        git diff of zh-CN/main.ftl and en-US/main.ftl (cmd-undo-changes,
        undo-done, undo-nothing, undo-busy, undo-unavailable, undo-detail,
        undo-part-restored/removed/skipped/uncovered/failed,
        undo-skip-external/deleted/blob-lost/unverified, undo-noop).
        both_locales_define_every_new_key iterates all 16 asserting rendered !=
        key in both locales and zh != en; I verified that fallback is real -
        Localizer::get returns the key verbatim for a missing message
        (localizer.rs:108-115) - so this genuinely proves presence, and the test
        is among the 61 registered xgent_ui tests I ran. Hardcoding: I
        programmatically scanned every added Rust line in the diff for CJK
        inside string literals; the only 4 hits are assert! messages inside
        executor.rs tests, and every user-facing string in
        undo.rs/command_palette.rs goes through tr/tr_with. agent_loop.rs:61 was
        not touched (its diff hunk adds only a comment and the session field).
        QUALITY DEFECT worth follow-up, not a violation of this item's wording:
        undo.rs:208-240 hardcodes full-width CJK punctuation around interpolated
        lists, so en-US renders English words wrapped in Chinese punctuation."
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: `cargo test -p xgent_tools --lib`, `cargo test -p xgent_agent
      --lib`, `cargo test -p xgent_ui --lib` and `cargo check --workspace
      --all-targets` pass; `Tool::write_targets` returns empty for `read_file`,
      `search_files` and `run_command` so those tools' behaviour is unchanged;
      `backup_existing` is gone from `atomic.rs` with no remaining callers."
    result: passed
    reason:
      text: "Every command in this item I ran myself: cargo test -p xgent_tools --lib
        = 127 passed / 0 failed; cargo test -p xgent_ui --lib = 61 passed / 0
        failed (and cargo test -p xgent_ui overall = 61 lib + 29 integration
        across all 8 targets, exit 0); cargo test -p xgent_agent --lib = 60
        passed / 0 failed; cargo check --workspace --all-targets = exit 0; cargo
        fmt -p xgent_tools/xgent_agent/xgent_ui/xgent_app/xgent_settings --
        --check = clean for all five (never cargo fmt --all). De-registration
        cross-check passed: 127 #[test]/#[tokio::test] attributes in
        crates/xgent_tools/src vs 127 lines in --list, 61 vs 61 in
        crates/xgent_ui/src, and I confirmed 16 checkpoint::tests plus 6
        undo::tests are individually listed. Cargo.toml is not modified, so
        there is no new dependency. backup_existing has no callers left - grep
        across the repo finds it only in markdown and comet artifacts. One
        deviation from the literal wording: read_file and search_files emptiness
        is pinned by read_only_tools_declare_no_write_targets, but run_command
        is NOT covered by any test; I verified it from source instead, since
        write_targets is overridden only in builtins/write_file.rs:43 and
        builtins/edit_file.rs:61, leaving RunCommand on the trait default
        Vec::new() (tool.rs:208-210) with run_command.rs absent from git status
        entirely."
      truncated: false
builder_handoff:
  candidate_id: 6987d746-9ad0-45f1-941e-c19fc897687d
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:8389077c-9a63-4210-84dc-62118960bbc0
  iteration: 1
  summary:
    text: >-
      Outcome: the agent's file writes are now undoable (gap R3-11). Before
      write_file/edit_file touch a file, the pre-write bytes are recorded per
      conversation turn under `<project>/.xgent/checkpoints/`; the user undoes
      the newest turn of the current session from the command palette,
      repeatedly, walking back turn by turn. An undo restores a file only when
      it still holds exactly what the agent wrote (FNV-1a content hash),
      otherwise it is skipped and named in the report. The orphan `*.xgent-bak`
      writer is gone.


      What landed:

      - `crates/xgent_tools/src/checkpoint.rs` (new, ~660 lines incl. 20 tests):
      `CheckpointStore` with `begin_turn`, `snapshot_before_write`,
      `finalize_after_write`, `undo_last_turn`/`undo_turn`, retention. Layout:
      `turns/<session>/<turn>.json` manifest (entries: relative path, kind
      Created|Modified, pre/post hash, blob name) +
      `blobs/<session>/<turn>-<index>-<hash>.bin`. Blob names carry the entry
      index; without it a multi-write turn's later snapshots overwrote earlier
      ones and undo stopped one write short (found by test, see A2).

      - `crates/xgent_tools/src/tool.rs`: new default method
      `Tool::write_targets(input, ctx) -> Vec<PathBuf>` (default empty, same
      style as `approval_for`/`preview_diff`). `write_file`/`edit_file`
      implement it through the `resolve_in_project` they already use, so no
      checkpoint entry can point outside the project.

      - `crates/xgent_tools/src/executor.rs`: `run_tool()` is the single choke
      point all three execution paths (Approved, session AllowAll,
      post-confirmation Allow) now go through: snapshot → execute → finalize,
      and finalize runs only when the result is not `is_error`. Store is
      optional (`attach_checkpoints`), unset by default, so unrelated callers
      and tests are untouched.

      - `crates/xgent_tools/src/atomic.rs`: `atomic_write_bytes` added
      (same-directory tmp + `sync_all` + rename, tmp cleanup) and reused by
      restore; `backup_existing`/`backup_path_for` deleted with their two
      callers.

      - `crates/xgent_agent/src/bridge.rs`: `AgentBridgeConfig.checkpoints` →
      `AgentBridge.checkpoints`; `AgentCommand::StartLoop` carries `session:
      u64` (the numeric `SessionId`, not `session:N` parsing); `run_agent_loop`
      calls `begin_turn(session)` at the top of each outer round, so a read-only
      round consumes no turn number and an in-flight round cannot race the undo.

      - `crates/xgent_ui/src/undo.rs` (new) + `command_palette.rs`: palette
      command `agent.undo-changes` (registered via `try_register`, routed in its
      own arm before the `plugin.` catch-all) → `UndoChangesMessage`;
      `request_undo` gates on Conversation Idle and spawns on the AgentBridge
      runtime; results surface as a one-line toast plus a persisted conversation
      notice whenever anything was skipped, uncovered or failed to write. Undo
      performs no bespoke buffer reload — the existing fs-watch pipeline handles
      it.

      - 16 keys added to both `zh-CN/main.ftl` and `en-US/main.ftl`;
      `doc/dev-tutorial.md` gets §5.14 检查点与撤销 plus the F-03 row.


      Decisions taken during Build (all inside the brief's Decisions): the
      snapshot lives in the executor, not in the tools (D-U2), which means a
      tool that forgets to declare its targets is silently non-undoable — pinned
      by `write_file_declares_its_resolved_target` and
      `executor_driven_write_file_is_undone`. Turn numbers are seeded from disk,
      not from memory, so a restart continues the sequence and never reuses a
      turn (`turn_number_continues_after_restart`,
      `empty_turn_does_not_reuse_turn_number`). Pruning runs when a turn's
      manifest is first created rather than in `begin_turn`; doing it in
      `begin_turn` was off by one and retained 21 turns. Undo is user-initiated
      only and never appears in the agent's tool list (D-U9), so a model cannot
      revert its own work.


      Evidence: `cargo test -p xgent_tools --lib` 127 passed (16 in the new
      checkpoint module), `cargo test -p xgent_ui` 61 lib + 29 integration
      passed, `cargo test -p xgent_agent --lib` 60, `xgent_settings` 14,
      `xgent_settings_core` 43, `xgent_provider` 50, `xgent_context` 42; `cargo
      check --workspace --all-targets` exit 0; `cargo fmt -p <crate> -- --check`
      clean for the 8 touched crates; `cargo clippy` over the six crates this
      change touches exits 0 with no remaining warning in any file of the diff
      (three pre-existing doc-format warnings live outside it and are recorded,
      not silently folded in). Counter-proof: 12 mutants over A1–A4, A6, A8,
      A10, A11 — all 12 caught on the final sources, but only after two rounds
      of finding my own holes: the first pass left M8 (turn number seeded from
      disk) and M9 (write_file declaring its targets) genuinely uncaught, which
      is why `empty_turn_does_not_reuse_turn_number`,
      `write_file_declares_its_resolved_target` and
      `executor_driven_write_file_is_undone` exist; the re-run then exposed that
      the batch had wired M11 (a missing en-US key) to `xgent_settings --lib`
      while the assertion that would fail it lives in `xgent_ui --lib`, so
      M10/M11 were re-run against the right crate and both failed as expected.
      Test attribute count was cross-checked against binary registration (188
      declared vs 127+61 registered) because a swallowed newline last round
      silently de-registered a test and made a mutant look uncaught. A full
      per-item evidence map is in the acceptance review.


      Honest limits: only `write_file`/`edit_file` are covered — `run_command`
      side effects and plugin `host.write_file` are not undoable, and the notice
      wording says so rather than implying full coverage. No redo, no history
      UI, no whole-session revert. The A9 buffer-reload half is verified by
      reading the existing pipeline, not by a GUI session (this app cannot be
      driven headlessly). Retention is a fixed 20 turns with no config key.
      Pre-existing `*.xgent-bak` files are not cleaned up, and the app still
      does not ensure the user's project gitignores `.xgent/`. Incidental
      finding recorded for a follow-up change: `EditorIoRuntime.handle` is never
      injected by `xgent_app`, so editor file IO has been running on its
      synchronous fallback in production; undo uses the AgentBridge runtime
      deliberately instead of depending on that resource.
    truncated: false

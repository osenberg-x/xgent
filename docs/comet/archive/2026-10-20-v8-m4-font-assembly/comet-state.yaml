        Mono"）、source =
        FontSource::Handle(handle)；crates/xgent_ui/src/fonts.rs:232/263/294
        把该内嵌候选登记为三平台 mono 候选栈的最后一位。测试 crates/xgent_ui/tests/font_slots.rs:29-54

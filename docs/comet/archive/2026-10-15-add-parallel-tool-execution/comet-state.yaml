  builder_execution_ref: skill-coordinated:builder:f42c6b2f-a702-4ba7-8ac1-99e2428a6360
  iteration: 1
  summary:
    text: |-
      Outcome: `Tool::concurrency()` is now consumed. Consecutive tool calls in one assistant turn that provably cannot interfere run concurrently instead of one-after-another, while the model, the conversation transcript and the user see exactly the ordering they saw before (gap R3-15, `unwired-design`: the API had zero consumers and the inner loop awaited every call in a `for`).

      What landed:
      - `crates/xgent_tools/src/executor.rs`: `parallel_safe(tool_id, input, ctx)` — eligibility needs **three independent signals**: resolved policy asks no confirmation (`Approved`, or `NeedsConfirmation` already covered by the session AllowAll set), the tool self-declares `Concurrency::Shared`, **and** `tier()` is exactly `Read`. The third carries two jobs: `Tool::concurrency()`'s trait default *is* `Shared`, so trusting only the self-declaration would let a write tool that forgot to declare `Exclusive` into a concurrent group; and `UiOnly` is excluded on purpose because `resolve_policy` approves that tier **without asking**, so admitting it would parallelise the shipped `editor.*` tools - whose `open_file -> goto` sequences carry ordering semantics - in a configuration the user never opted into.
      - `crates/xgent_agent/src/bridge.rs`: `execute_tool_call()` runs one call and deliberately emits nothing; the loop walks `outcome.tool_calls`, groups consecutive eligible calls up to `cap`, and runs each group with `futures::future::join_all` — polled inside the agent task, not spawned, so a cancelled/dropped loop cannot leave a tool writing files in the background. Results are emitted in the **original index order** (`group.iter().zip(results)`), the `ToolCall` events are still pre-emitted, and the abort path keeps its pairing rules: started siblings report their real results, groups that never started get the existing placeholders.
      - `crates/xgent_settings_core/src/project.rs` + `xgent_app`: `[agent] max_parallel_tools` (default 4, `0` = unset → 4, never "unlimited"), read through `effective_max_parallel_tools()` into `AgentBridgeConfig` and down to the loop.
      - Tests: 8 new in `bridge_tests.rs` (a `ProbeTool` that counts in-flight calls, waits a bounded 400ms for the concurrency it wants to see, and races the cancel token in its hold window), 2 new in `executor.rs` tests, 1 new in `project.rs` tests. Overlap is asserted as an observed in-flight maximum, never as elapsed time — a timing assertion would flake under load and could also be satisfied by a fast serial run.
      - Docs: `doc/dev-tutorial.md` F-03 row plus a new §5.16 工具并行执行.

      Decisions taken during Build (all inside the confirmed brief): scheduling lives in the agent loop and policy stays in the executor (D-P1) — `execute` remains the only place resolving policy, confirmation and checkpoints, so parallelism is a scheduling layer, not a second execution path; `join_all` over spawned tasks (D-P2) for cancellation safety; only *consecutive* eligible calls group (D-P3) rather than reordering to hunt for parallelism, because a write the model asked for first must still run first; confirmation stays strictly one-at-a-time (D-P4/D-P5) because `SharedConfirm` holds a single `Mutex<Option<Sender>>` and a second concurrent request would overwrite the first and lose a user decision.

      Honest scope notes that are part of the design, not oversights: with the shipped default configuration nothing runs in parallel - most tools are excluded by the policy signal, and `UiOnly` (which the policy auto-approves) is excluded by the tier signal - so the win is opt-in via existing `[tools] approved` or an AllowAll click; two calls to the same WASM plugin instance still execute one at a time because that plugin task drains its queue sequentially (`wasm_host.rs:231`), so overlapping them is safe but gains nothing; results become visible at group granularity; `parallel_safe` is advisory and non-atomic with `execute`'s own re-resolution, whose only possible disagreement is one extra confirmation prompt, never a skipped one. A6 has no separate test of its own — with nothing approved it is the same run as A3, and it is recorded that way instead of padding the count.

      Evidence: 68 xgent_agent lib tests (60 baseline + 8 new; 68 declared attributes == 68 registered by `--list`), 129 xgent_tools, 44 settings_core, 14/50/42/62 for settings/provider/context/ui baselines, `cargo check --workspace --all-targets` exit 0, `cargo fmt -p <crate> -- --check` clean for the touched crates. Counter-proof: 11 mutants — AP1 scheduler back to serial (4 tests fail), AP2 cap ignored (3), AP3 result/pairing order reversed, AP4 unstarted-group placeholders dropped, AP5 concurrency guard deleted, AP6 tier guard deleted, AP7 `NeedsConfirmation` treated as parallel, AP8 AllowAll ignored, AP9 `parallel_safe` always false, AP10 `0` read as unlimited, AP11 default drift 4→8 — all 11 caught, but AP5 initially read as uncaught because the batch targeted `xgent_tools --lib` while the test isolating that signal (`exclusive_call_is_a_barrier_for_its_neighbours`) lives in `xgent_agent`; after rewiring the batch to the crate holding the assertion it failed exactly that test. A2 therefore deliberately uses a `Read`-tier `Exclusive` probe: with an `Exec` tier the tier guard alone would have kept that test green and the concurrency guard would have had no discriminating test at all.

      Iteration note (candidate 3): the second Verifier run returned 9/9 passed yet its risk list contained a factual defect, and I did not accept the result. The brief, the spec, dev-tutorial and this ledger all stated "with the shipped default configuration every tool resolves to NeedsConfirmation, so nothing runs in parallel" - the premise is false, because `resolve_policy` auto-approves the `UiOnly` tier and `EditorTool` is `UiOnly + Shared` and shipped: editor commands were in fact grouping concurrently out of the box, and their ordering was resting on the incidental fact that `EditorTool::execute` never awaits before emitting. Fix: eligibility narrowed to `tier == Read` (executor.rs:175), a `UiOnlySharedTool` unit case added in xgent_tools, and a new behavioural test `bridge_tests::default_config_parallelises_nothing_even_for_auto_approved_ui_only` asserting max-in-flight 1 **and** confirm_requests == 0 for two UiOnly probes under factory defaults; the false premise sentence was corrected in the spec, brief, dev-tutorial §5.16 and ledger §九. Mutants AP12/AP13 (widening the rule back) fail those two tests respectively, so the fix is pinned rather than merely re-worded. Agents 69 / tools 129 / settings_core 44 after the change; no other behaviour moved.

      Earlier iteration note: this was candidate 2. Candidate 1 failed exactly one Runtime check - c8, `cargo fmt -p <crate> -- --check` - because I formatted the agent/tools crates after the last test edits but not xgent_settings_core, whose new `max_parallel_tools_zero_means_default_not_unlimited` had an over-long assert line. Everything else (agent 68, tools 129, settings_core 44, neighbouring baselines, cargo check --workspace --all-targets, clippy over the four touched crates) had already passed. The fix is formatting only; no behaviour, assertion or evidence changed, and the fmt claim above is now backed by a sweep over all eight touched crates rather than by assumption.

      Process note for this submission: because the fix required editing the confirmed formal artifacts (the tier rule and the false premise sentence live in the brief and the capability spec), Runtime sent the change back to Shape; the corrected Shape was reconfirmed and this is the candidate submitted after that reconfirmation. All claims above were re-run against this tree immediately before submitting: agent 69 / tools 129 / settings_core 44, `cargo check --workspace --all-targets` exit 0, `cargo fmt -p <crate> -- --check` swept over the touched crates, and clippy over the four touched crates leaves no warning in any file this change touches (the doc-comment list indentation it flagged in the new `parallel_safe` comment was fixed rather than left).
    truncated: false

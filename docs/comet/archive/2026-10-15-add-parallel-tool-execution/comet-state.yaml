acceptance:
  - id: A1
    source: brief.md
    text: "**A1**: two `Approved` read-only tools in one `tool_calls` list, each
      blocking until it observes two calls in flight (bounded wait, then it
      reports what it saw) → both observe concurrency 2 and succeed. With the
      serial loop they would each time out and report 1. The assertion is the
      observed count, not elapsed time."
    result: passed
    reason:
      text: "bridge_tests.rs:2916 approved_read_tools_actually_overlap: two
        ProbeTool(tier=Read, Shared, approved) with ProbeState::new(2);
        ProbeTool::execute (bridge_tests.rs:2784-2802) increments an AtomicUsize
        in-flight counter, records the max, then bounded-waits (400ms deadline,
        2ms poll) until in_flight >= target before holding holds_ms=30. Under a
        serial loop the bounded wait always times out and st.max() stays 1, so
        `assert_eq!(st.max(), 2)` (line 2936) fails — the test is discriminating
        against a serial scheduler, and it asserts an observed count, never
        elapsed time. Ran myself: `cargo test -p xgent_agent --lib` -> 69 passed
        (also Runtime check c1, log b7d5b5b6-c1, 69 passed in 4.33s). The
        scheduler path that makes this pass is bridge.rs:970-1005
        (consecutive-eligible scan + join_all)."
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2**: a list of `[shared, exclusive, shared]` → the exclusive call
      observes exactly one in-flight tool (itself) at every moment of its run,
      the two shared calls do not overlap with it, and results still arrive in
      order 0,1,2."
    result: passed
    reason:
      text: "bridge_tests.rs:2957 exclusive_call_is_a_barrier_for_its_neighbours:
        calls are [pa Read/Shared, px Read/Exclusive, pb Read/Shared], all in
        the approved list, cap=MAX_PARALLEL_TOOLS. Asserts result outputs are
        exactly vec![\"pa:0\",\"px:1\",\"pb:2\"] and st.max()==1. I checked
        discrimination by reading parallel_safe (executor.rs:176-182): the
        concurrency guard (`tool.concurrency() != Concurrency::Shared -> false`)
        is the only thing that excludes px, because px is deliberately tier=Read
        and approved — deleting that guard would make all three eligible and
        drive st.max() to 3, failing line 2981. So this test isolates the
        concurrency signal independently of the tier signal, matching the
        brief's requirement. Registered and passing (same c1 run)."
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3**: two calls whose policy is `NeedsConfirmation` (and not in
      `allowed_all`) → the confirmation slot never holds two pending requests:
      the fake confirm callback asserts that it is called, returns a decision,
      and is only called again after the first has resolved. The decisions apply
      to their own calls (`Deny` on the first, `Allow` on the second → the first
      is denied, the second runs)."
    result: passed
    reason:
      text: "bridge_tests.rs:3089
        confirmations_are_asked_one_at_a_time_and_never_overlap: approved list
        empty, so both Read probes resolve to NeedsConfirmation
        (security.rs:58). The drive loop counts ConfirmRequestMessage arrivals
        and answers one per frame, tracking max_unanswered; asserts
        confirm_requests==2, results.len()==2, all results non-error,
        max_unanswered==1 and st.max()==1. I read SharedConfirm
        (bridge.rs:169-183):
        `Arc<Mutex<Option<oneshot::Sender<ConfirmDecision>>>>` with take/set —
        genuinely one slot, so if a confirmation-pending call entered a group
        the second request would overwrite the first sender and execute's
        `Ok(Err(_))` branch (executor.rs:278) would return 确认被取消, failing both
        the !err assertion (3124) and max_unanswered==1. parallel_safe's
        NeedsConfirmation arm (executor.rs:185) only admits ids already in
        allowed_all, so grouping such a call is not reachable. Caveat recorded
        in risks: the literal 'Deny first, Allow second' decision-routing
        instance is not in this test (it answers Allow twice); per-call denial
        is pinned pre-existing by executor.rs:530
        needs_confirmation_deny_rejected, which still passes untouched (c2, 129
        passed)."
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4**: three eligible calls with durations `30ms, 10ms, 20ms` →
      `ToolResult` events come out in call order (ids `c0, c1, c2`) and
      `req.messages` carries the three tool results in the same order, each
      paired with its own `call_id`."
    result: passed
    reason:
      text: 'bridge_tests.rs:2987
        results_keep_model_order_even_when_completion_differs: holds are
        120/10/60ms so completion order is c1,c2,c0 while call order is
        c0,c1,c2; target=3 with `assert_eq!(st.max(),3)` (3002) proves real
        overlap, then `assert_eq!(ids, vec!["c0","c1","c2"])` (3003-3011) and
        output pairing pa:0/pb:1/pc:2 (3012-3020). Discriminating:
        bridge.rs:1006 emits via `group.iter().zip(results)` in original index
        order, so switching to completion order (or `.rev()`) breaks it.
        req.messages pairing under the grouped path is covered by the
        pre-existing bridge_tests.rs:1584
        multi_tool_calls_single_assistant_message, which uses EchoTool (tier
        Read + Shared, bridge_tests.rs:266-271) with an approved list and
        cap=MAX_PARALLEL_TOOLS (bridge_tests.rs:153) — i.e. it really runs
        through the concurrent grouping — and asserts one assistant message with
        2 ToolCall blocks plus exactly 2 tool-role results in
        second_req.messages (1729-1746); the same `executed` vector feeds both
        the events and req.messages (bridge.rs:1019/1105-1124), so pairing order
        follows the asserted event order.'
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5**: with `max_parallel_tools = 1`, a batch of four overlapping-asking
      tools never observes 2 in flight; with `max_parallel_tools = 4` and eight
      such tools, the recorded maximum is exactly 4 (never 5+), and all eight
      produce results."
    result: passed
    reason:
      text: "Two behavioural caps, both read from the parameter and not a literal:
        bridge_tests.rs:3025 cap_one_serialises_even_approved_read_tools (three
        Read/Shared approved probes, cap=1, asserts 3 results and st.max()==1)
        and bridge_tests.rs:3049 cap_two_bounds_the_group (four probes, cap=2,
        asserts results.len()==4 and st.max()==2). Both are discriminating
        against a hardcoded/ignored cap: bridge.rs:970-978 bounds the scan with
        `end - idx < cap`, so replacing it with the default 4 gives st.max()==3
        in the first test and 4 in the second, and forcing cap=1 breaks the
        `st.max()==2` assertion. The multi-wave property (more calls than the
        cap) is exercised by the cap=2/four-calls case, which additionally
        proves no call is dropped. Deviation noted in risks: the brief's literal
        instance 'cap=4 with eight overlapping-asking tools, maximum exactly 4'
        was not run; the exceeding-the-cap code path is the same one, and
        exceeding 4 is structurally impossible because groups run sequentially
        (join_all awaited at bridge.rs:1005 before idx advances)."
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6**: default configuration (no `[tools]` approvals, no AllowAll) → the
      observed maximum in-flight count is 1 for a list of read calls, **and also
      for `UiOnly` calls that the policy auto-approves without any confirmation
      request being raised** (the second case is the discriminating one, since
      only the `tier()` rule excludes it); the event stream and `req.messages`
      are unchanged in shape."
    result: passed
    reason:
      text: 'Both halves are now pinned by their own tests. Read calls under factory
        policy: bridge_tests.rs:3089 (approved empty) asserts st.max()==1.
        UiOnly calls, which the policy auto-approves with no confirmation:
        bridge_tests.rs:3250
        default_config_parallelises_nothing_even_for_auto_approved_ui_only uses
        probe("ua"/"ub", ToolTier::UiOnly, Concurrency::Shared) with an empty
        approved list and cap=MAX_PARALLEL_TOOLS, and asserts results.len()==2,
        all non-error, st.max()==1 AND confirm_requests==0. I verified the
        premise from source rather than from the docs: security.rs:57
        `ToolTier::UiOnly => SecurityPolicy::Approved` (unconditional, no
        confirmation), and executor.rs:179-182 `if tier != ToolTier::Read {
        return false }`. So the new test would fail if eligibility were widened
        back to `Read | UiOnly`: both probes would then pass parallel_safe,
        join_all would group them, and st.max() would become 2 (the target=2
        bounded wait would also stop timing out). The `confirm_requests == 0`
        assertion genuinely separates it from A3: if the tier were Read instead
        of UiOnly, resolve_policy would ask for confirmation and that count
        would be 2, failing line 3281. At executor level the same rule is pinned
        by executor.rs:717 parallel_safe_requires_all_three_signals case
        (executor.rs:752-759) using the UiOnlySharedTool double
        (executor.rs:676-713, shape identical to the shipped EditorTool). Both
        suites pass (c1/c2 and my own runs).'
      truncated: false
  - id: A7
    source: brief.md
    text: '**A7**: cancel arrives while a group of three is in flight → every
      `call_id` gets exactly one `ToolResult`, the in-flight ones report the
      interruption, calls in later groups get the existing "未执行" placeholder,
      and the loop leaves through the abort path it uses today.'
    result: passed
    reason:
      text: "In-group abort: bridge_tests.rs:3139
        abort_during_concurrent_group_pairs_every_call asserts st.max()==3 as a
        precondition before writing AbortMessage, then asserts the sorted result
        ids are exactly [c0,c1,c2] and all three are error results.
        Never-started groups: bridge_tests.rs:3192
        abort_before_later_groups_places_placeholders_for_them (cap=1, 350ms
        holds) asserts one result lands before abort, then ids [c0,c1,c2]. In
        code, bridge.rs:1027-1047 gives each already-started group member
        工具执行被中断 and continues the ordered zip loop (no early break, so no member
        is skipped), bridge.rs:1075-1095 placeholder-fills
        outcome.tool_calls[idx..] with the existing 工具执行因中断而未执行 text, and
        bridge.rs:1127-1134 leaves through the same Done+return None abort exit
        as HEAD (compared against `git show HEAD:...`, whose serial loop did the
        equivalent with `remaining = &outcome.tool_calls[executed.len()..]`).
        Dropping the placeholder block fails the ids assertion (only c0
        present), so the pairing guarantee is pinned."
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8**: `[agent] max_parallel_tools` — a TOML with no `[agent]` section
      resolves to `4`; `max_parallel_tools = 0` also resolves to `4`;
      `max_parallel_tools = 2` resolves to `2` and reaches `run_agent_loop`
      (proved behaviourally by A5's `= 1` / `= 4` cases, so the cap is
      demonstrably read from configuration and not a literal)."
    result: passed
    reason:
      text: "project.rs:54 adds `max_parallel_tools: usize` with `#[serde(default)]`;
        defaults::MAX_PARALLEL_TOOLS = 4 (project.rs:101);
        effective_max_parallel_tools() (147-149) maps 0 -> 4. Tests read myself
        and passing (c3 and my own run, 44 passed): project.rs:299
        toml_without_new_sections_resolves_to_builtin_defaults parses TOML with
        no [agent] section at all and asserts the effective value is 4 (line
        309); project.rs:320 max_parallel_tools_zero_means_default_not_unlimited
        asserts absent -> 4, `= 0` -> 4 while the raw field stays 0 (326), and
        `= 2` -> 2 (330). Wiring, not hardcoded: main.rs:189
        `max_parallel_tools:
        project_config.agent.effective_max_parallel_tools()` ->
        AgentBridgeConfig (bridge.rs:417) -> bridge.rs:595 passes
        cfg.max_parallel_tools into run_agent_loop -> bridge.rs:725 parameter ->
        bridge.rs:970 `let cap = max_parallel_tools.max(1)`. That the value
        really reaches the loop rather than being a literal is demonstrated
        behaviourally by A5's cap=1 and cap=2 runs."
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9**: `cargo test -p xgent_agent --lib`, `cargo test -p xgent_tools
      --lib`, `cargo test -p xgent_settings_core --lib`, `cargo check
      --workspace --all-targets` and `cargo fmt -p <crate> -- --check` pass;
      `Tool::concurrency` has a real consumer (it is read on the scheduling

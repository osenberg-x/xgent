      `ToolExecutor::execute` keeps its existing signature and all existing
      executor tests still pass untouched."
    result: passed
    reason:
      text: "Independent runs: `cargo test -p xgent_agent --lib` 69 passed, `cargo
        test -p xgent_tools --lib` 129 passed (c2; plus `--list` registration

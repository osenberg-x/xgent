  known_limits:
    - text: "Parallelism is inert by default: with the shipped security posture every
        tool resolves to NeedsConfirmation, so nothing overlaps until a user
        approves read-only tools in `[tools]`/project config or clicks Allow
        all. This is the intended trade (safety over speed) but it means the
        latency win is opt-in, not automatic."
      truncated: false
    - text: Only *consecutive* eligible calls group together. A list like [read,
        write, read, read] runs as [read] | [write] | [read read]; the scheduler
        never reorders to find more parallelism, so an early write costs the
        later reads their overlap window.
      truncated: false
    - text: "Calls into the same WASM plugin instance still execute one at a time: the
        plugin task consumes its queue sequentially
        (crates/xgent_plugin/src/wasm_host.rs:231), which is also why
        overlapping them is safe. Two calls to one plugin therefore gain nothing
        from this change, and the tests do not claim otherwise."
      truncated: false
    - text: Overlap is proven by observed in-flight counters, not by wall time. No
        latency benchmark against a real provider was run, so 'reads finish
        sooner' is established as a scheduling property rather than a measured
        speedup.
      truncated: false
    - text: "Because results are reported in the model's order, a group's later
        results cannot appear before an earlier call finishes even if they are
        ready: the user sees results at group granularity. ToolProgress events
        are unchanged and may still interleave out of order - they are progress,
        not results."
      truncated: false
    - text: A tool that never yields (a CPU loop without an await point) would stall
        every other member of its group, since the group is polled inside one
        task rather than spawned. Every tool in the workspace is await-based IO
        and run_command - the only plausibly CPU-heavy one - is Exclusive;
        nothing in the test suite would catch a future violation of this.
      truncated: false
    - text: "parallel_safe is advisory: execute re-resolves policy, confirmation and
        checkpoints itself. The two reads are not atomic, and the only
        disagreement direction is a user clicking 'Allow all' while a group
        runs, which costs at most one extra confirmation prompt - never a
        skipped one."
      truncated: false
    - text: max_parallel_tools has no settings-panel surface (same gap as R3-13) and
        bounds only one group of one turn; there is no global cap on tool calls
        in flight across concurrent conversations.
      truncated: false
    - text: "UiOnly tools (the shipped editor.* family) are deliberately never
        parallel-eligible, even though resolve_policy approves that tier without
        confirmation: open_file -> goto carries ordering semantics. Editor calls
        therefore gain no overlap from this change; if a future editor tool
        wants concurrency, the ordering guarantee has to be re-derived rather
        than assumed."
      truncated: false
    - text: GUI-level behaviour (how group-wise results look in the tool panel) was
        not exercised - this app cannot be driven headlessly. Ordering and
        pairing are asserted on the ECS messages the panel consumes, which is
        the strongest available proxy.
      truncated: false
    - text: "cargo clippy --workspace and cargo test --workspace were not run: each
        links the whole bevy graph and costs a long rebuild on this machine.
        Formal coverage is per-crate lib tests plus cargo check --workspace
        --all-targets plus clippy over the four touched crates."
      truncated: false
    - text: "A6 shares its behavioural test with A3 rather than adding a redundant
        one: with nothing approved the two scenarios are literally the same run.
        The separate claim 'the default event stream is unchanged in shape'
        rests on the pre-existing executor/conversation tests passing
        untouched."
      truncated: false
  known_limits_truncated: false

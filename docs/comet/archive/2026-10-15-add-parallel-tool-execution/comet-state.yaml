  risks:
    - text: "A5's literal instance was not reproduced: no test runs eight eligible
        calls with the default cap of 4 and asserts a recorded maximum of
        exactly 4. The bounding property is proven at cap=1 (three calls) and
        cap=2 (four calls, two waves) and is structurally guaranteed by `end -
        idx < cap` (bridge.rs:978) with groups awaited one after another
        (bridge.rs:1005). Follow-up worth a cheap test: one 8-call/cap=4 case to
        close the gap by evidence rather than by argument."
      truncated: false
    - text: A3's literal decision mix (Deny on the first, Allow on the second) is not
        in the new bridge test — it answers Allow twice. Serial per-call denial
        is pinned only pre-existing at executor level (executor.rs:530
        needs_confirmation_deny_rejected). The one-at-a-time property itself is
        directly asserted (max_unanswered == 1), so the safety claim holds; the
        mixed-decision routing is the uncovered remainder.
      truncated: false
    - text: "The 'default configuration is inert' invariant is true now, and the
        correction is real rather than cosmetic, but it depends on one narrow
        code line: executor.rs:180 `if tier != ToolTier::Read { return false }`.
        Any future widening back to `Read | UiOnly` (or a new auto-approved
        tier) silently parallelises the shipped editor.* commands. The two
        guards I read (executor.rs:752-759 and bridge_tests.rs:3250) would both
        fail on that change, which is the right pinning; still, the invariant's
        safety rests on the tier rule, not on the policy rule, and the docs
        should keep saying so explicitly (they now do: brief.md:46/49,
        spec.md:17/56/62, dev-tutorial §5.16, ledger §九 fact 3)."
      truncated: false
    - text: xgent_tools declares `bevy = { workspace = true }`
        (crates/xgent_tools/Cargo.toml:18), already true at HEAD and untouched
        by this change, while AGENTS.md §4 and this brief's constraint say the
        crate is Bevy-free. This change added no dependency, so it did not
        worsen it, but the documented claim is inaccurate independently of this
        change and deserves its own cleanup or AGENTS.md correction.
      truncated: false
    - text: "No global bound on tool calls in flight across concurrent conversations
        or multiple agent loops: max_parallel_tools bounds one group inside one
        turn only, and it has no settings-panel surface (the same gap R3-13
        covers). A user with several windows open gets N x 4 concurrent read
        tools."
      truncated: false
    - text: Per D-P2 (join_all inside the agent task rather than spawn), a future tool
        that busy-loops without an await point would stall every other member of
        its group. Every current tool is await-based IO and run_command is
        Exclusive, but no test could detect a violation of that precondition if
        one is introduced later.
      truncated: false
    - text: "Group-wise result visibility is a real UI-feel change: a fast earlier
        result cannot be shown before a slow one in the same group
        (bridge.rs:1006 emits only after join_all completes). ToolProgress
        events are unaffected. This app cannot be driven headlessly, so what
        that looks like in the tool panel is not verified; ordering and pairing
        are asserted on the ECS messages the panel consumes, which is the
        strongest available proxy, and the brief's Verification expectations
        already declare the live-provider latency win unverified (no wall-time
        assertions by design)."
      truncated: false
    - text: "The builder's /tmp/apt-limits.json is stale against the corrected code on
        two points, and both should not be carried forward as limits: item 1
        repeats the falsified premise ('with the shipped security posture every
        tool resolves to NeedsConfirmation'), which is false for UiOnly; item 12
        claims 'A6 shares its behavioural test with A3 rather than adding a
        redundant one', which is no longer true now that
        default_config_parallelises_nothing_even_for_auto_approved_ui_only
        exists. The repository documents are the corrected ones."

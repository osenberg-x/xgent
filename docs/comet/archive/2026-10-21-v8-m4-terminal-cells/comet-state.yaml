    text: A1 `MonoMetrics` 由**实测**得出：探针经 bevy 文本管线读排版结果反推（取 `ComputedTextBlock` 的
      parley layout 原始值，不用 `ceil` 过的 `TextLayoutInfo.size`），四个字段均有值且 `at_size ==
      type_scale::CODE`；实测值写进启动日志。
    result: passed
    reason:
      text: 独立复核 crates/xgent_ui/src/terminal/metrics.rs：探针 spawn_probe 用同一 mono
        槽位（fonts.mono.clone()）、type_scale::CODE 字号、type_scale::line_height::TERM
        行高、Visibility::Hidden（保留布局）；collect_mono_metrics 读 ComputTextBlock 的
        parley 原始值（block.buffer().full_width()/height()/scale()，未用 ceil 过的
        TextLayoutInfo.size），advance=(width/scale)/samples，还原逻辑像素；at_size 固定为
        type_scale::CODE(=12.0，见 theme.rs:326)。四字段均有值：单测
        mono_metrics_is_measured_at_runtime 实跑 headless App 断言
        latin_advance>0、cjk_advance>0、line_height>0、at_size==type_scale::CODE，测试通过。实测值写
        tracing::info!（家族+latin+cjk+行高+字号+单元格宽+结论），本轮复核确认 info! 行恒含结论。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 双宽校验是纯函数：`cjk_advance ≈ 2 × latin_advance` 时不告警；偏差超阈值时返回告警文案并把基准宽调整为
      `max(latin_advance, cjk_advance / 2)`。
    result: passed
    reason:
      text: MonoMetrics::check() 是无副作用纯函数（metrics.rs:65-116）：double_width_ok =
        |cjk-2*latin| <= 2*latin*CJK_ADVANCE_TOLERANCE(0.1)；不满足时 cell_w =
        latin_advance.max(cjk_advance/2.0)
        并返回告警文案。三个单测独立通过：double_width_ratio_ok_uses_latin_advance(7.2/14.4→cell_w=7.2
        且
        warning=None)、double_width_ratio_violation_warns_and_widens_cell(7.2/12.0→告警+cell_w=7.2
        即 max
        分支)、double_width_ratio_violation_widens_cell_when_cjk_is_wider(7.0/20.0→cell_w=10.0=cjk/2)。本轮新增
        warning_wording_matches_actual_cell_width_change 亦通过：CJK
        偏窄措辞含「维持」不含「调整为」，偏宽含「调整为」。
      truncated: false

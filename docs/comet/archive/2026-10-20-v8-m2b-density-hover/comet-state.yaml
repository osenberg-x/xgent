    reason:
      text: 不累乘由结构保证而非一次性算术：DensityBase 仅在 Without<DensityBase>
        时捕获一次基线（density.rs:102-113），写回始终是 scale(base,
        density)（:47-79），从不以当前值再乘。单测
        density_is_idempotent_and_reversible（:191-213）连续 5 帧断言仍为 12.0、切回
        Comfortable 回到 16.0/8.0；集成测试 tests/density.rs:78-91 再跑 5 帧仍为 6.0 并逐字还原
        8.0/12.0。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 持久化：daemon 配置协调器写入 `preferences.density = "compact"` 成功（不再报「未知配置
      key」）并可读回 `Compact`（`xgent_daemon` 单测）。

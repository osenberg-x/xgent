    reason:
      text: 'crates/xgent_settings_core/src/global.rs:277-279 对 density 字段加
        #[serde(default)]，Density 派生 Default 且 #[default] 在
        Comfortable（:296-304）；单测
        global::tests::density_defaults_and_parses（:370-396）断言
        Preferences::default()==Comfortable、density="compact" 反序列化为 Compact、仅有
        [providers.*] 的老 TOML 仍为 Comfortable、往返保持；density-units
        日志：xgent_settings_core lib 14 passed / 0 failed。'
      truncated: false
  - id: A2

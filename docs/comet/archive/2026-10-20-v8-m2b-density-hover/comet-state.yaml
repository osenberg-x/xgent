      20→15）、设置面板卡片（16→12、row_gap 8→6）的 `Node.padding` / `row_gap` 按 0.75
      收紧（集成测试断言这三处具体数值）。
    result: passed
    reason:
      text: 断言落在真实插件产出的节点上：tests/density.rs:52-92 取
        ActivityBarMarker（layout.rs:174-193，padding
        vertical=space::SM=8、row_gap=XS=4）与 TopBarMarker，切 Compact 后
        8→6、4→3、16→12、12→9 且 rail width 仍 52；:96-109 取
        chat_panel::MessageListMarker（chat_panel.rs:173-177，padding
        XXL=24、row_gap XL=20）断言 24→18、20→15；:180-195
        取设置面板卡片（settings_panel.rs:758-762，width=size::OVERLAY_SETTINGS_W=640、padding
        LG=16、row_gap SM=8，全仓仅此一处使用该宽度常量）断言 16→12、8→6。数值与 brief/spec
        文本逐项一致；ui-density 日志 4 passed / 0 failed。生效时机由 density.rs:175-187
        的单测（set 后仅 app.update() 一次即 18/15）证到「同一帧或下一帧」。
      truncated: false
  - id: A3

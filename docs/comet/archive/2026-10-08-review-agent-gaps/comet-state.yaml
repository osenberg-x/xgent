  - id: A1
    source: brief.md
    text: "A1: `doc/notes/agent-gap-review.md` exists and contains one
      non-duplicative ranked gap list. Each entry has: rank, gap title, gap
      class label (planned-not-built / built-but-defective / unwired-design /
      doc-inconsistency), one-line description, and evidence — `file:line` for
      implementation gaps, or a named document section for design-level gaps."
    result: passed
    reason:
      text: 产物 doc/notes/agent-gap-review.md 存在，脚本枚举 45
        条排名条目（R1×10、R2×4、R3×21、R4×10）连续无跳号，构成单一排名清单；逐条核对五要素（rank/标题/类别标签/一句话描述/证据），45/45
        齐备无缺项。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: The ranking is ordered by risk-and-blocking first: safety,
      runaway-cost, and unbounded-loop defects occupy the top ranks; MVP-scope
      acceptance blockers follow; experience improvements and P1/P2 roadmap
      items follow last. The document states this ordering rule explicitly."
    result: passed
    reason:
      text: §一显式声明四层排序规则（含 blast radius 排序原则）；rank 序列严格 R1→R2→R3→R4
        无跨带穿插；逐条核对各带实际内容与所标层级吻合（R1 全为无界执行/失控计费/沙箱缺失/凭据明文；R2 四条恰为 requirements.md
        标 MVP 却未实现或矛盾的项；R3 为主路径降级；R4 全为 P1/P2 路线项）。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Every implementation gap asserted in the document cites a `file:line`
      that exists in the current tree, and no gap is listed twice —
      cross-cutting defects appear as a single entry that names all affected
      call sites."
    result: passed
    reason:
      text: 全量核对未抽样：脚本抽取 98 处 file:line 引用提及、展开 236 个行级引用，逐条打开被引文件读取该行比对——文件存在
        98/98，行号越界 0，悬空引用 0，反引号引用的代码/注释原文逐字命中。另独立 grep 复验 12 处零命中检索全部确认 0
        命中。去重核对通过：跨切面缺陷均合并为单条目并在证据内列出全部调用点。3 处 off-by-1/2 与 1 处锁类型误述已记入 risks
        并已在修复中处理。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: All four gap classes are present: planned-but-unbuilt features (from
      requirements.md / plugin-system-design.md), built-but-defective
      implementations, architecture designs declared but unwired in code, and
      documentation-vs-code inconsistencies. Each class is visually
      distinguishable in the document."
    result: passed
    reason:
      text: 四类齐备且视觉可区分：标题统计 built-but-defective 22、planned-not-built 15、unwired-design
        7、doc-inconsistency 1，另 §四专章承载 doc-inconsistency 12
        条；§二另设标签定义表，逐类说明。归类抽查符合 spec『按实际代码状态归类』规则（R1-6/R1-9 unwired-design
        恰当；R3-2 占位文件 planned-not-built 恰当）。R3-5 标签拼写异常已记入 risks 并已在修复中处理。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Every P0/MVP requirement item from `doc/design/requirements.md` that
      is claimed implemented is either absent from the report or accompanied by
      contradicting code evidence, so the report does not silently inherit the
      existing documentation claims. The document does not modify any existing
      document under `doc/`."
    result: passed
    reason:
      text: git status --porcelain doc/ 仅输出 ?? doc/notes/agent-gap-review.md，doc/
        下零修改（唯一工作区改动 .gitignore 为本变更之前既有状态）。对 requirements.md 标 MVP/P0
        且被声称已实现的项逐条给出反证代码而非继承文档说法：F-07→response_api.rs:31/custom.rs:30；NF-04→零命中；F-04→security.rs:58；F-05→main.rs:106-107

acceptance:
  - id: A1
    source: brief.md
    text: "A1: A Chinese user message with no spaces, whose phrases appear in a
      file's content, produces keywords that match that file, and the retrieved
      result includes that file. The same message before the change produced a
      single whole-sentence keyword and no match."
    result: passed
    reason:
      text: 'crates/xgent_context/src/on_demand.rs:287-319 extract_keywords +
        split_runs(337)/cjk_bigrams(350). Verifier ran the crate suite: `cargo
        test -p xgent_context` -> 37 passed/0 failed, incl.
        on_demand::tests::retrieve_finds_file_from_chinese_question and
        retrieve_degrades_to_tree_when_no_keywords. Verifier also reproduced
        both halves in /tmp with real ripgrep 15.0.0 on a fixture mirroring the
        test: pre-change code (git diff baseline, byte length w.len()>=3, split
        on whitespace/ascii punctuation) yields keywords=["上下文检索在哪里实现"] and `rg
        --files-with-matches -i <that string> <root>` exits 1 with zero matches;
        shipped code yields 9 bigrams [上下,下文,文检,检索,索在,在哪,哪里,里实,实现] and the
        shipped argv exits 0 matching src/retrieval.rs. Second spec scenario
        (stop-words + single CJK only) holds:
        retrieve_degrades_to_tree_when_no_keywords asserts tree returned, chunks
        empty.'
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Keyword extraction measures word length in characters, drops CJK runs
      of one character, turns a CJK run of two or more characters into
      overlapping two-character slices, filters the listed Chinese and English
      stopwords, and returns at most 16 keywords in question order without
      duplicates."
    result: passed
    reason:
      text: 'Char-vs-byte rule asserted with a multi-byte non-ASCII token: test
        extract_keywords_measures_chars_not_bytes uses "éé" (2 chars/4 bytes)
        and asserts empty; Verifier ran it (passed) and in /tmp confirmed under
        the pre-change byte rule it returns ["éé"] / ["bc好d"]. Single-char CJK
        run dropped (windows(2) yields none) ->
        extract_keywords_drops_single_cjk_char. Overlapping bigrams ->
        extract_keywords_splits_cjk_into_bigrams asserts exact vec
        [上下,下文,文检,检索]. Stopwords -> extract_keywords_drops_function_words covers
        EN_STOPWORDS (on_demand.rs:35-39) and CN_FUNC_CHARS (44-49,
        is_func_bigram 356); Verifier re-ran in /tmp and got 的是/什么 dropped, 如何
        dropped, use kept. Cap/order/dedup: MAX_KEYWORDS=16 at on_demand.rs:31
        with truncate at 317 and push_keyword dedup at 322;
        extract_keywords_caps_at_sixteen_in_order asserts len==16,
        kws[0..1]==[一二,二三], kws[7]==八九, kws[8]==alpha and dedup on "检索 检索 检索".
        /tmp run of the shipped functions on that 18-candidate input returned
        exactly 16 in question order.'
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: A hint of the form `@file:src/main.rs` causes that file's content to
      appear as a context chunk, and the literal string `@file:src/main.rs` is
      never used as a search keyword."
    result: passed
    reason:
      text: 'on_demand.rs:273-281 file_refs + retrieve step 3 (106-118) reads the
        referenced file with ChunkRole::Referenced; extract_keywords:291-297
        skips hints starting with FILE_REF_PREFIX. Tests passed:
        extract_keywords_excludes_file_ref_hint, file_refs_parses_hint_paths,
        retrieve_includes_referenced_file (asserts chunk path ends with
        src/main.rs and relevance mentions 引用),
        retrieve_ignores_missing_referenced_file. /tmp run of the shipped
        functions: hints [@file:src/main.rs, ContextHub] -> keywords
        [ContextHub] only; under pre-change hint handling ->
        ["@file:src/main.rs", "ContextHub"] (defect confirmed removed). Producer
        side is real: crates/xgent_agent/src/bridge.rs:523-539 builds hints as
        format!("@file:{}", path) from editor @ references
        (crates/xgent_ui/src/editor/at_syntax.rs), so this is not an unused code
        path.'
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Keywords containing regular-expression metacharacters (`+`, `<`, `>`,
      `(`, `.`, `/`) are searched as literals: the `rg` invocation uses
      fixed-string matching with one pattern per keyword, such a keyword neither
      matches unintended content nor causes a failed `rg` run that triggers the
      full-tree fallback."
    result: passed
    reason:
      text: "Builder declared the rg branch never executed; Verifier found this
        inaccurate and closed the gap directly:
        /Users/xdo/.qoder-cn/plugins/cache/qoderapp-bundler/qoder-context/1.0.7\
        4.7a73af9/bin/rg (ripgrep 15.0.0) is on PATH and resolves from a spawned
        process, so the retrieve tests do exercise rg_search. Verifier ran
        rg_args (copied verbatim from on_demand.rs:258-270) against real rg in
        /tmp: argv
        [--files-with-matches,-i,--fixed-strings,-e,a+b,-e,ContextHub,<root>]
        exits 0 and returns only src/lit.rs + src/hub.rs, while the pre-change
        joined regex `a+b|ContextHub` additionally matched src/other.rs (literal
        \"ab\" false positive removed). Metacharacter keyword `(` with
        --fixed-strings exits 0; the pre-change joined form `( |ContextHub`
        exits 2 with empty stdout, which by on_demand.rs:191-193 returns None
        and triggers the full-tree fallback -> that failure mode is eliminated.
        Exit 1 (no match) still returns Some(vec![]) (187-189) so it is not
        treated as failure; --no-ignore still absent so .gitignore honoured, -i
        kept, RG_TIMEOUT_SECS and MAX_SEARCH_FILES untouched. Test
        rg_args_matches_each_keyword_literally asserts the exact argument
        sequence and the absence of any '|', and passed."
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Directory traversal and fallback search perform their filesystem
      calls in non-async functions that are invoked through
      `tokio::task::spawn_blocking`, and the tree text and search results they
      return are unchanged from before."
    result: passed
    reason:
      text: "Verifier read the call sites directly instead of relying on the two
        formatting-sensitive source-scan tests. on_demand.rs:149-159
        tree_summary and 209-215 fallback_search are the only async callers and
        both wrap the sync helpers in tokio::task::spawn_blocking (lines 151,
        212 - the only two occurrences in the file); collect_tree_lines(413) and
        collect_matching_files(421) plus walk_tree(430)/walk_search(469) are
        non-async, and every std::fs occurrence in the file (434, 480, 500, and
        test-only 550-567/938-939) sits under a non-async fn header; the async
        fns (80,149,162,171,209,218) contain no std::fs (read_file_chunk uses
        tokio::fs). Panics/cancel map to empty via unwrap_or_default.
        Content-unchanged verified against git diff: walk_search body untouched
        (same TREE_MAX_DEPTH/MAX_SEARCH_FILES/visited>2000 bounds, same literal
        content.contains, same strip_prefix relative path); walk_tree only lost
        an unused root/rel computation the old code discarded with `let _ =
        rel;`, indent expression identical -> same tree text. Passing tests:
        collect_tree_lines_is_sync_and_skips_ignored,
        collect_matching_files_is_sync_and_returns_relative_paths (exact vec
        equality on crates/demo/lib.rs),
        tree_summary_includes_files_skips_ignored,
        fallback_search_finds_matches, std_fs_calls_never_appear_in_async_fns,
        traversal_helpers_are_awaited_via_spawn_blocking."
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: When merged chunks from several providers exceed `query.max_tokens`,
      the hub keeps chunks in provider order up to the budget, drops the chunks
      that do not fit without rewriting their content, and reports
      `total_tokens` as the sum of the kept chunks; when the merged result
      already fits, every chunk is kept unchanged."
    result: passed
    reason:
      text: "hub.rs:92-103 clamp_to_budget walks chunks in merged provider order,
        skips (continue) any chunk whose estimate does not fit the remaining
        budget and keeps looking, pushes retained chunks verbatim (no
        truncation), and returns used as the recomputed total; called at
        hub.rs:76-78 after the builtin-then-plugin loop, tree_summary taken from
        the first provider (63-65, 71-73) and not counted. Verifier checked the
        edge paths arithmetically and by test: zero budget -> 0+1>0 so nothing
        kept and total 0 (zero_budget_keeps_nothing passed); later smaller chunk
        still fits -> with budget 70 and [30,30,30,5,5] the third 30 is dropped
        and the following 5s are kept, total 70
        (over_budget_merge_keeps_prefix_and_recomputes_total passed, and asserts
        every kept content still ends with its original suffix); already-fits
        case keeps all three chunks in order with total 30 and the first
        provider's tree (within_budget_merge_is_unchanged passed); empty
        providers neither contribute nor fail
        (empty_provider_contributes_nothing,
        clamp_drops_chunks_larger_than_budget passed). No consumer depends on
        the old summed total: outside this crate total_tokens appears only at
        crates/xgent_plugin_host/src/context.rs:97 (plugin's own value) and a
        fixture literal in xgent_agent/src/format.rs:168."
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Each returned chunk's `relevance` states what actually happened — the
      keywords the chunk content matched, or that it is the current file — and
      no chunk carries the previous constant string."
    result: passed
    reason:
      text: "relevance_for (on_demand.rs:386-401) composes a role label (当前打开文件 / 用户
        @file 引用的文件 / 关键词检索命中) with matched_keywords(367) - the keywords
        literally present in the retained content, case-folded - and honestly
        says 但裁剪后的片段未包含任何关键词 when a search hit shows none. It is the only
        relevance assignment in the crate's production path (on_demand.rs:243);
        repo-wide grep for 匹配用户问题或当前文件 returns only the historical doc comment
        (on_demand.rs:384), the guarding assertion (on_demand.rs:956) and docs
        (doc/notes/agent-gap-review.md:155, agent-gap-disposition.md:89,
        docs/comet/.../comet-state.yaml:204) - no code path emits it. Passing
        tests: relevance_lists_only_keywords_present_in_content (findme+alpha
        listed, beta absent, old constant absent) and
        relevance_marks_current_file_and_unmatched_hits;
        retrieve_includes_referenced_file checks the referenced-file wording on
        a real chunk."
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: `cargo test -p xgent_context` passes with the new tests, and `cargo
      check --workspace` passes, so no consumer of `xgent_context`
      (`xgent_agent`, `xgent_app`, `xgent_plugin_host`) broke."
    result: passed
    reason:
      text: "Verifier ran both commands itself on the on-disk candidate: `cargo test
        -p xgent_context` -> \"test result: ok. 37 passed; 0 failed\" (doc-tests
        ok too), including all ~20 new cases; `cargo check --workspace` -> exit
        0 (3m11s, xgent_agent / xgent_app / xgent_plugin_host / xgent_ui /
        xgent_plugin / xgent_daemon all re-checked); `cargo check --workspace
        --all-targets` -> exit 0, so consumer test targets compile; `cargo fmt
        -p xgent_context -- --check` -> exit 0 (read-only). Coupling was also
        inspected, not assumed: no consumer test asserts on this crate's
        retrieval behaviour (crates/xgent_plugin_host/tests/ecs_registration.rs
        only inserts ContextHub::default(); xgent_agent's format/bridge tests
        build their own ContextChunk fixtures), and the public API gained only
        is_cjk_char, so nothing was renamed or retyped."
      truncated: false
